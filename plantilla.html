<script>
/* ===================================================================
   6. CATÁLOGO
   Se inyecta desde el .docx en el paso de armado (build.py). No se
   escribe a mano: cada vez que agregás canciones al cancionero, se
   vuelve a generar.
   Formato de cada canción:
     id      → identificador estable (se usa en la lista compartida)
     nombre  → nombre sin el tono ni el bpm
     tono    → tono original, o null si el título no lo trae
     bpm     → número, o null si no está
     bloques → los párrafos de la canción, en orden, tal cual el .docx:
                 r = rótulo de sección (gris cursiva)
                 a = línea de acordes  (cian, se transporta)
                 l = línea de letra    (blanco, no se toca)
                 v = línea en blanco
   =================================================================== */
/* Capa base: las canciones que vienen del .docx. No se modifica nunca.
   Encima se aplica la capa de cambios (ediciones, nuevas y borradas), que
   vive en almacenamiento compartido. El catálogo efectivo es la suma de
   las dos, y es lo que ve la app. */
const CATALOGO_BASE = JSON.parse(document.getElementById("datos-catalogo").textContent);
let CATALOGO = [];

/* Índice por id: buscar una canción de la lista sin recorrer todo */
let PORID = {};

/* Rearma el catálogo efectivo. Se llama al arrancar y cada vez que cambia
   la capa de cambios (propia o traída de otro celular). */
function recalcular(){
  const cam = est.cambios;
  const borradas = new Set(cam.borradas || []);
  CATALOGO = CATALOGO_BASE
    .filter(c => !borradas.has(c.id))
    .map(c => cam.editados && cam.editados[c.id] ? cam.editados[c.id] : c)
    .concat((cam.nuevas || []).filter(c => !borradas.has(c.id)))
    .sort((a, b) => a.nombre.localeCompare(b.nombre, "es", {sensitivity:"base"}));
  PORID = {};
  CATALOGO.forEach(c => PORID[c.id] = c);
}

/* Cuántas canciones tocó el grupo. Se muestra en el botón de exportar. */
function contarCambios(){
  const c = est.cambios;
  return Object.keys(c.editados || {}).length + (c.nuevas || []).length + (c.borradas || []).length;
}

/* Id para una canción nueva: legible y estable, sin repetirse */
function nuevoId(nombre, tono){
  const base = nombre.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 44) || "cancion";
  let cand = base + (tono ? "-" + tono.toLowerCase().replace("#", "s") : "");
  let n = cand, i = 2;
  const ocupados = new Set(CATALOGO_BASE.map(c => c.id).concat((est.cambios.nuevas || []).map(c => c.id)));
  while (ocupados.has(n)) n = `${cand}-${i++}`;
  return n;
}


/* ===================================================================
   7. TRANSPORTE DE ACORDES
   Sube o baja semitonos sólo en los bloques de acordes. Como en el
   cancionero los acordes ya están en su propia línea con estilo
   propio, sé con certeza que todo token de esas líneas es un acorde
   o una barra de compás: no hay que adivinar nada.

   Lo importante: al reescribir la línea se respetan las columnas
   originales. Si "G" se convierte en "A#" (un carácter más), se come
   un espacio de al lado en vez de empujar todo y desalinear la letra.
   =================================================================== */
const SOSTENIDOS = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const BEMOLES    = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
/* Tonos que por convención se escriben con bemoles */
const TONOS_BEMOL = new Set(["F","Bb","Eb","Ab","Db","Gb","Dm","Gm","Cm","Fm","Bbm","Ebm"]);

/* Devuelve el índice 0-11 de una nota, o -1 si no es nota */
function indiceNota(n){
  let i = SOSTENIDOS.indexOf(n);
  if (i < 0) i = BEMOLES.indexOf(n);
  return i;
}

/* Mueve una sola nota (sin el resto del acorde) N semitonos */
function moverNota(nota, semis, usarBemoles){
  const i = indiceNota(nota);
  if (i < 0) return nota;
  const j = ((i + semis) % 12 + 12) % 12;
  return usarBemoles ? BEMOLES[j] : SOSTENIDOS[j];
}

/* Mueve un acorde entero: raíz + sufijo + bajo opcional (D/F#) */
function moverAcorde(ac, semis, usarBemoles){
  return ac.split("/").map(parte => {
    const m = parte.match(/^([A-G][#b]?)(.*)$/);
    if (!m) return parte;
    return moverNota(m[1], semis, usarBemoles) + m[2];
  }).join("/");
}

/* Calcula el tono resultante, para mostrarlo y para decidir la
   escritura con sostenidos o bemoles */
function moverTono(tono, semis){
  const m = String(tono).match(/^([A-G][#b]?)(.*)$/);
  if (!m) return tono;
  const menor = /^m/.test(m[2]);
  const raiz = moverNota(m[1], semis, false);
  /* Probamos la versión con bemoles: si ese tono se escribe así por
     convención, la usamos */
  const raizB = moverNota(m[1], semis, true);
  const cand = raizB + (menor ? "m" : "");
  return (TONOS_BEMOL.has(cand) ? raizB : raiz) + m[2];
}

/* Reescribe una línea de acordes completa manteniendo las columnas */
function moverLinea(linea, semis, usarBemoles){
  if (!semis) return linea;
  let salida = "";
  for (const m of linea.matchAll(/\S+/g)){
    /* Rellenar con espacios hasta la columna original.
       Si el token anterior creció y ya pasamos esa columna,
       dejamos al menos un espacio para que no se peguen. */
    if (salida.length < m.index) salida += " ".repeat(m.index - salida.length);
    else if (salida.length > 0) salida += " ";
    const tok = m[0];
    salida += /^[A-G][#b]?/.test(tok) ? moverAcorde(tok, semis, usarBemoles) : tok;
  }
  return salida;
}


/* ===================================================================
   8. ESTADO Y ALMACENAMIENTO
   - lista  → COMPARTIDA (shared:true): la ve todo el grupo. Es el
              único dato compartido; el catálogo viene en el archivo.
   - ajustes→ LOCAL (shared:false): tamaño de letra y nombre del
              dispositivo. Cada uno tiene los suyos.
   No hay aviso automático de cambios: se consulta cada 4 segundos
   ("polling"). Gana la última escritura, así que conviene que
   arme la lista una sola persona.
   =================================================================== */
/* Dibuja los bloques de una canción. La usan el lector y la vista previa
   del editor, así lo que ves mientras editás es idéntico a lo que se ve
   después en el escenario. */
function pintarBloques(destino, bloques, semis, conBemoles){
  destino.innerHTML = "";
  const envoltorio = document.createElement("div");
  envoltorio.className = "scrollx";
  bloques.forEach(b => {
    const d = document.createElement("div");
    if (b.t === "v"){ d.className = "bloque b-vacio"; }
    else if (b.t === "r"){ d.className = "bloque b-rotulo"; d.textContent = b.v; }
    else if (b.t === "a"){ d.className = "bloque b-acordes"; d.textContent = moverLinea(b.v, semis, conBemoles); }
    else { d.className = "bloque b-letra"; d.textContent = b.v; }
    envoltorio.appendChild(d);
  });
  destino.appendChild(envoltorio);
}

/* --- Detector de línea de acordes -------------------------------------
   El mismo criterio con el que se importó el .docx: una línea es de
   acordes si TODOS sus elementos son cifrados o barras de compás. Es
   estricto a propósito, para que "Dios" no pase por acorde. */
const RE_CIFRADO = /^[A-G](?:#|b)?(?:maj|Maj|M|min|m|sus|add|dim|aug|°|ø|\+|-|[0-9]|#|b|\(|\)|,)*$/;
const RE_ADORNO = /^(\||\|\||\/\/|\/|-|–|x\d+|\(x\d+\))$/;

function esCifrado(tok){
  if (RE_ADORNO.test(tok)) return true;
  const partes = tok.split("/");
  return partes.every(p => p && RE_CIFRADO.test(p));
}
function esLineaDeAcordes(t){
  const toks = t.split(/\s+/).filter(Boolean);
  return toks.length > 0 && toks.every(esCifrado);
}

/* --- Bloques -> texto editable ----------------------------------------
   Los rótulos llevan ":" adelante. Los acordes y la letra van tal cual
   cuando el detector los reconoce solo; si no los reconocería bien, se
   les pone ">" o "." para forzar el tipo. Así el texto se lee igual que
   el cancionero y a la vez la ida y vuelta nunca pierde información. */
function bloquesATexto(bloques){
  return bloques.map(b => {
    if (b.t === "v") return "";
    if (b.t === "r") return ":" + b.v;
    if (b.t === "a") return esLineaDeAcordes(b.v) ? b.v : ">" + b.v;
    return esLineaDeAcordes(b.v) ? "." + b.v : b.v;
  }).join("\n");
}

/* --- Texto editable -> bloques ---------------------------------------- */
function textoABloques(txt){
  const salida = [];
  let vacioPendiente = false;
  txt.replace(/\r/g, "").split("\n").forEach(linea => {
    if (!linea.trim()){ vacioPendiente = true; return; }
    if (vacioPendiente && salida.length) salida.push({t:"v"});
    vacioPendiente = false;
    const marca = linea[0];
    /* Se saca sólo el carácter del marcador: el resto de los espacios se
       conserva intacto, porque son los que alinean el acorde. */
    if (marca === ":") salida.push({t:"r", v: linea.slice(1).trim()});
    else if (marca === ">") salida.push({t:"a", v: linea.slice(1)});
    else if (marca === ".") salida.push({t:"l", v: linea.slice(1).trim()});
    else if (esLineaDeAcordes(linea)) salida.push({t:"a", v: linea});
    else salida.push({t:"l", v: linea.trim()});
  });
  return salida;
}

/* ===================================================================
   CONFIGURACIÓN DE FIREBASE
   Pegá acá los datos que te da la consola de Firebase al crear la app web.
   Mientras esto quede sin completar, la app funciona igual como cancionero,
   pero sin compartir nada: la lista y las ediciones viven sólo en este
   dispositivo y se pierden al recargar.

   Si la consola del navegador se queja de la versión del SDK, cambiá
   VERSION_SDK por la que indique Firebase. Es lo único que hay que tocar.
   =================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCDsFBJ2HRzt-m0U2dvI58ix-fa6dYZMMU",
  authDomain: "cancionero-peniel.firebaseapp.com",
  projectId: "cancionero-peniel",
  storageBucket: "cancionero-peniel.firebasestorage.app",
  messagingSenderId: "1058088412288",
  appId: "1:1058088412288:web:d094ea329d74ca51c3f265",
};
const VERSION_SDK = "11.0.2";

/* ===================================================================
   8. ESTADO Y SINCRONIZACIÓN
   Tres tipos de documento en Firestore:

     cancionero/activa    -> puntero: { reunionActivaId }. Dice cuál de
                              las reuniones guardadas es "la de ahora",
                              la que ve la pestaña Reunión y el modo
                              reunión.
     reuniones/{id}       -> una reunión guardada: { nombre, ids,
                              porQuien, creada, actualizada }. Cada
                              domingo (o ensayo) es un documento propio;
                              no se pisan entre sí.
     canciones/{id}       -> una canción editada, agregada o borrada.

   Por qué una canción y una reunión por documento, y no todo junto en
   uno: si dos personas tocan cosas distintas al mismo tiempo, Firestore
   escribe en documentos distintos y no hay conflicto posible. Con un
   documento único, el último en guardar pisaba el trabajo del otro.

   onSnapshot avisa en el momento en que algo cambia, así que no hace
   falta preguntar cada tantos segundos como antes.
   =================================================================== */
let db = null;                 // conexión a Firestore, o null si no hay
let fs = null;                 // funciones del SDK, cargadas al arrancar
let HAY_NUBE = false;
let cancelarEscuchaActiva = null;  // deja de escuchar la reunión activa anterior

const est = {
  pestana:"canciones",
  filtro:"",
  filtroAgregar:"",    // buscador del panel rápido "Agregar canciones"
  filtroGuardadas:"",  // buscador de la pestaña Guardadas, por nombre
  /* La reunión activa. id:null significa que todavía no se creó
     ninguna: se crea sola la primera vez que alguien toca +. */
  lista:{ id:null, ids:[], porQuien:"", cuando:0, nombre:"", semis:{} },
  guardadas:[],         // todas las reuniones guardadas, para la pestaña Guardadas
  cambios:{ editados:{}, nuevas:[], borradas:[] }, // capa de ediciones
  editando:null,       // id de la canción abierta en el editor (o "nueva")
  cargando:true,
  orden:"nombre",      // orden del catálogo: nombre, tono o bpm
  tamano:16,           // px del cuerpo de la canción
  semis:0,             // transporte de la canción abierta
  abierta:null,        // id de la canción en el lector
  enReunion:false,     // true si entró por "Empezar reunión"
  posicion:0,          // índice dentro de la lista
  esDirector:false,    // si está prendido, cada cambio se transmite
  soloLectura:false,   // true mientras se ve la transmisión del director: no se puede tocar nada
};

/* --- Conexión ---------------------------------------------------------
   Se carga el SDK con import() dentro de un try: si no hay internet, si
   la versión no existe o si la configuración está vacía, la app sigue
   andando como cancionero local en vez de quedarse en blanco. */
async function conectar(){
  if (!FIREBASE_CONFIG.projectId){
    marcarSync("error", "sin configurar");
    return false;
  }
  try{
    const base = `https://www.gstatic.com/firebasejs/${VERSION_SDK}`;
    const [apl, fst] = await Promise.all([
      import(`${base}/firebase-app.js`),
      import(`${base}/firebase-firestore.js`),
    ]);
    const app = apl.initializeApp(FIREBASE_CONFIG);

    /* Caché en disco: si el wifi de la iglesia se cae en medio de la
       reunión, la lista sigue estando. Si el navegador no lo soporta,
       se usa la conexión normal sin caché. */
    try{
      db = fst.initializeFirestore(app, { localCache: fst.persistentLocalCache({}) });
    }catch(e){
      db = fst.getFirestore(app);
    }
    fs = fst;
    HAY_NUBE = true;
    return true;
  }catch(e){
    console.error("No se pudo conectar a Firestore:", e);
    marcarSync("error", "sin conexión");
    return false;
  }
}

/* --- Escuchar cambios en vivo ---------------------------------------- */
function escuchar(){
  if (!HAY_NUBE) return;

  /* Lo que transmita quien sea director, siempre escuchado (no hace
     falta "activar" nada para que la pestaña Online funcione). */
  escucharDirector();

  /* El puntero a la reunión activa. Cuando cambia (alguien creó una
     reunión nueva o tocó "Usar esta" en Guardadas) hay que dejar de
     escuchar la reunión vieja y empezar a escuchar la nueva. */
  fs.onSnapshot(fs.doc(db, "cancionero", "activa"), snap => {
    const d = snap.data();
    const id = (d && d.reunionActivaId) || null;
    if (id !== est.lista.id) escucharReunionActiva(id);
  }, e => {
    console.error("Error escuchando la reunión activa:", e);
    marcarSync("error", "error de permisos");
  });

  /* Todas las reuniones guardadas, para poder listarlas en Guardadas */
  fs.onSnapshot(fs.collection(db, "reuniones"), snap => {
    const arr = [];
    snap.forEach(doc => {
      const d = doc.data();
      arr.push({
        id: doc.id, nombre: d.nombre || "", ids: d.ids || [],
        porQuien: d.porQuien || "", creada: d.creada || 0,
        actualizada: d.actualizada || d.creada || 0, semis: d.semis || {},
        fechaReunion: d.fechaReunion || d.creada || 0,
      });
    });
    arr.sort((a, b) => b.creada - a.creada);
    est.guardadas = arr;
    if (est.pestana === "guardadas") pintar();
  }, e => {
    console.error("Error escuchando las reuniones guardadas:", e);
    marcarSync("error", "error de permisos");
  });

  /* Las canciones editadas, agregadas y borradas */
  fs.onSnapshot(fs.collection(db, "canciones"), snap => {
    const cam = { editados:{}, nuevas:[], borradas:[] };
    snap.forEach(doc => {
      const d = doc.data();
      if (d.borrada){ cam.borradas.push(doc.id); return; }
      const cancion = { id:doc.id, nombre:d.nombre, tono:d.tono ?? null,
                        bpm:d.bpm ?? null, bloques:d.bloques || [] };
      if (d.nueva) cam.nuevas.push(cancion);
      else cam.editados[doc.id] = cancion;
    });
    est.cambios = cam;
    recalcular();
    /* No redibujar el editor mientras alguien escribe en él */
    if (!est.editando){
      pintar();
      if (est.abierta && PORID[est.abierta]) pintarLector();
    }
  }, e => {
    console.error("Error escuchando las canciones:", e);
    marcarSync("error", "error de permisos");
  });
}

/* --- Escuchar el contenido de la reunión activa -----------------------
   Se llama cada vez que cambia el puntero cancionero/activa. Si no hay
   ninguna reunión activa todavía (id null, recién instalado o después de
   borrar todo), se muestra la pestaña Reunión vacía: se crea sola en
   cuanto alguien toca + por primera vez. */
function escucharReunionActiva(id){
  if (cancelarEscuchaActiva){ cancelarEscuchaActiva(); cancelarEscuchaActiva = null; }
  if (!id){
    est.lista = { id:null, ids:[], porQuien:"", cuando:0, nombre:"", semis:{}, fechaReunion:0 };
    pintar();
    return;
  }
  cancelarEscuchaActiva = fs.onSnapshot(fs.doc(db, "reuniones", id), snap => {
    const d = snap.data();
    if (d){
      est.lista = {
        id, ids: d.ids || [], porQuien: d.porQuien || "",
        cuando: d.actualizada || d.creada || 0, nombre: d.nombre || "",
        semis: d.semis || {}, fechaReunion: d.fechaReunion || d.creada || 0,
      };
      pintar();
    }
    /* fromCache indica que lo que estoy viendo salió de la caché y todavía
       no lo confirmó el servidor: es la señal honesta de "estoy offline". */
    marcarSync(snap.metadata.fromCache ? "escribiendo" : "ok",
               snap.metadata.fromCache ? "sin conexión" : "al día");
  }, e => {
    console.error("Error escuchando la reunión:", e);
    marcarSync("error", "error de permisos");
  });
}

/* ===================================================================
   MODO DIRECTOR / PESTAÑA ONLINE
   No hay "un" director: cualquiera puede prender "Director" y, mientras
   esté prendido, cada canción que abre o cada transporte que hace se
   escribe en cancionero/directorEnVivo. Si dos personas son director a
   la vez, gana la última escritura: no hay forma de "pelear" por el
   control, sólo de pisarse (aceptado a propósito, es un grupo chico).

   directorEnVivo.directores cuenta cuántos dispositivos tienen el chip
   Director prendido en este momento (+1 al prender, -1 al apagar, con
   increment() para que sea seguro aunque escriban varios a la vez).
   Online se considera vacío apenas ese número llega a 0, aunque haya
   quedado una canción vieja en cancionId: así apagar Director vacía la
   pantalla de todos, no deja pegada la última canción para siempre.
   Límite conocido: si alguien cierra la app sin apagar el chip (en vez
   de apagarlo a propósito), ese +1 nunca baja solo; se corrige a mano
   desde la consola de Firebase, igual que otros documentos huérfanos de
   este proyecto (ver sección 8b).

   No hace falta "activar" nada para ver la transmisión: la pestaña
   Online siempre escucha ese documento (escucharDirector() arranca con
   el resto de los listeners). Entrar a Online muestra la vista en vivo
   si hay algo, o "vacío" si no. El resto de la app (Canciones,
   Historial, Evento, o una canción abierta por cuenta propia) sigue
   navegándose libre, sin que el director interrumpa nada fuera de esa
   pestaña. */
let ultimoBroadcastDirector = null;  // lo último que transmitió el director, o null si no hay nadie dirigiendo

async function alternarDirector(){
  est.esDirector = !est.esDirector;
  pintar();
  if (est.abierta) pintarLector();
  if (!HAY_NUBE) return;
  const ref = fs.doc(db, "cancionero", "directorEnVivo");
  try{
    if (est.esDirector){
      await fs.setDoc(ref, { directores: fs.increment(1) }, { merge: true });
    } else {
      /* Al apagar, si éste era el último director, se reinicia el
         documento entero (no un merge): si sólo se restara el contador,
         el cancionId de la transmisión anterior quedaría pegado ahí, y
         resucitaría como "hay transmisión" la próxima vez que alguien
         prenda Director. Transacción para que sea seguro aunque dos
         personas apaguen el chip al mismo tiempo. */
      await fs.runTransaction(db, async tx => {
        const snap = await tx.get(ref);
        const actual = (snap.data() && snap.data().directores) || 0;
        const nuevo = actual - 1;
        if (nuevo <= 0) tx.set(ref, { directores: 0 });
        else tx.set(ref, { directores: nuevo }, { merge: true });
      });
    }
  }catch(e){
    console.error("No se pudo actualizar directores activos:", e);
  }
}

let directoresActivos = 0;  // cuántos dispositivos tienen el chip Director prendido ahora

function escucharDirector(){
  if (!HAY_NUBE) return;
  fs.onSnapshot(fs.doc(db, "cancionero", "directorEnVivo"), snap => {
    const d = snap.data();
    const nuevo = (d && d.directores) || 0;
    if (nuevo !== directoresActivos){
      directoresActivos = nuevo;
      if (est.pestana === "reunion") pintar();  // refresca el número en el chip Director
    }
    const hayDirector = directoresActivos > 0;
    if (!hayDirector){
      ultimoBroadcastDirector = null;
      if (est.soloLectura) cerrarVistaOnline();
      else if (est.pestana === "online") pintarOnline();
      return;
    }
    if (!d.cancionId) return;
    ultimoBroadcastDirector = d;
    if (est.soloLectura) mostrarVistaOnline(d);        // ya la está mirando: se actualiza sola
    else if (est.pestana === "online") pintarOnline(); // está en la pestaña: la abre
    else{
      /* Estos dos no se pisan: la pestaña Evento (de fondo) y el lector
         (una tapa arriba) pueden estar los dos activos a la vez. */
      if (est.pestana === "reunion") pintar();  // aparece/desaparece "Ver Online" en el pie
      if (est.abierta) pintarLector();          // refresca el botón O si hay una canción abierta
    }
  }, e => {
    console.error("Error escuchando al director:", e);
  });
}

/* Cierra la vista en vivo porque dejó de haber director (no porque el
   usuario haya tocado la flecha): se queda en la pestaña Online, ahora
   sí mostrando el aviso de vacío. */
function cerrarVistaOnline(){
  $("lector").classList.remove("abierto");
  est.abierta = null;
  est.soloLectura = false;
  if (est.pestana === "online") pintarOnline();
}

/* Botón de emergencia: reinicia directorEnVivo entero (sin merge), para
   cuando alguien se fue sin apagar Director y quedó una canción vieja
   pegada para todo el grupo. Cualquiera puede tocarlo, no sólo un
   director, porque cualquiera puede notar el problema. */
async function vaciarTransmision(){
  if (!confirm("¿Vaciar la transmisión para todos? Usalo sólo si quedó una canción vieja pegada.")) return;
  if (!HAY_NUBE){ flotar("Sin conexión"); return; }
  try{
    await fs.setDoc(fs.doc(db, "cancionero", "directorEnVivo"), { directores: 0 });
    flotar("Transmisión vaciada");
  }catch(e){
    console.error("No se pudo vaciar la transmisión:", e);
    flotar("No se pudo vaciar la transmisión");
  }
}

/* Abre el lector en modo sólo lectura con lo que transmitió el
   director: sin transportar, sin tocar el riel, sin deslizar para
   cambiar de canción. Los cambios los hace el director, acá sólo se
   mira. Se llama al entrar a la vista en vivo desde Online, y de nuevo
   cada vez que el director transmite algo nuevo mientras se la sigue
   mirando. */
/* Botón "Transmitir" del pie del Evento: arranca la transmisión con la
   primera canción de la lista de una, en vez de sólo abrirla y esperar
   a que el director toque el botón O. Entra como la vista en vivo
   (soloLectura) para que se vea igual que Online, pero sin apagarle
   ningún control: sigue siendo director, sigue con todo disponible. */
function transmitirDesdeElPrincipio(){
  if (!est.lista.ids.length) return;
  const id = est.lista.ids[0];
  est.posicion = 0;
  est.abierta = id;
  est.enReunion = true;
  est.soloLectura = true;
  est.semis = semisGuardado(id);
  $("lector").classList.add("abierto");
  $("cuerpo").scrollTop = 0;
  pintarLector();
  transmitirEstado();
}

function mostrarVistaOnline(d){
  const s = PORID[d.cancionId];
  if (!s) return;
  const cambioCancion = est.abierta !== d.cancionId;
  est.abierta = d.cancionId;
  est.enReunion = true;
  est.soloLectura = true;
  est.semis = d.semis || 0;
  const idx = est.lista.ids.indexOf(d.cancionId);
  est.posicion = idx >= 0 ? idx : 0;
  $("lector").classList.add("abierto");
  if (cambioCancion) $("cuerpo").scrollTop = 0;
  pintarLector();
}

/* Se llama después de cada acción que cambia lo que se ve en modo
   reunión (abrir canción, pasar, transportar). Sin conexión o fuera de
   modo reunión, no hace nada. */
async function transmitirEstado(){
  if (!est.esDirector || !est.enReunion || !est.abierta || !HAY_NUBE) return;
  try{
    await fs.setDoc(fs.doc(db, "cancionero", "directorEnVivo"), {
      cancionId: est.abierta, semis: est.semis, posicion: est.posicion, cuando: Date.now(),
    }, { merge: true });
  }catch(e){
    console.error("No se pudo transmitir:", e);
  }
}

/* Si la canción que se está viendo ya es la que está en vivo, un
   transporte se manda solo (es "corregir el tono en el momento", no
   "empezar a transmitir algo nuevo"). Si es una canción distinta a la
   transmitida, transportarla es sólo mirar: no dispara nada, para no
   arrancar una transmisión por accidente al tocar ♭/♯. */
function retransmitirSiYaEstaEnVivo(){
  if (ultimoBroadcastDirector && ultimoBroadcastDirector.cancionId === est.abierta) transmitirEstado();
}

/* Id nuevo para una reunión: si hay conexión, lo genera Firestore (así no
   choca con el de otro dispositivo); si no, uno local alcanza porque
   nadie más lo va a usar mientras no haya nube. */
function generarIdReunion(){
  return HAY_NUBE
    ? fs.doc(fs.collection(db, "reuniones")).id
    : "local-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* Nombre por defecto de una reunión nueva: la fecha de hoy, editable
   después. dd/mm/aaaa a mano, sin toLocaleDateString, para no depender de
   qué configuración regional tenga el navegador (o Node, al probar). */
function fechaHoyTexto(){
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
}

/* --- Guardar la lista de la reunión activa ---------------------------
   El orden de canciones (ids) y el transporte por canción (semis): son
   los dos datos que cambian sin pasar por el editor. merge:true porque
   puede llegar a escribir antes de que la creación (crearReunion) haya
   terminado de confirmarse: sin merge pisaría el documento entero con
   un objeto a medias. */
async function guardarLista(){
  if (!est.lista.id) return;  // no hay reunión activa todavía
  if (!HAY_NUBE){ flotar("Sin conexión: la lista no se comparte"); return; }
  marcarSync("escribiendo", "guardando");
  try{
    await fs.setDoc(fs.doc(db, "reuniones", est.lista.id), {
      ids: est.lista.ids,
      semis: est.lista.semis || {},
      actualizada: Date.now(),
    }, { merge: true });
    marcarSync("ok", "al día");
  }catch(e){
    console.error("No se pudo guardar la lista:", e);
    marcarSync("error", "no se guardó");
    flotar("No se pudo guardar la lista");
  }
}

/* --- Crear una reunión y hacerla la activa ----------------------------
   Se usa tanto cuando se crea sola (primer + de la reunión de hoy) como
   cuando se arma una a propósito desde Guardadas. fechaReunion es el día
   en que se va a tocar (editable después, puede ser a futuro): por
   defecto arranca en el momento de la creación, pero es un dato aparte
   de "creada" (que sólo sirve para ordenar por "Recientes"). */
async function crearReunion(id, nombre, ids, semis, fechaReunion){
  if (!HAY_NUBE){ flotar("Sin conexión: el evento no se comparte"); return; }
  marcarSync("escribiendo", "guardando");
  try{
    await fs.setDoc(fs.doc(db, "reuniones", id), {
      nombre, ids, semis: semis || {}, porQuien: "",
      creada: Date.now(), actualizada: Date.now(),
      fechaReunion: fechaReunion || Date.now(),
    });
    await fs.setDoc(fs.doc(db, "cancionero", "activa"), { reunionActivaId: id });
    marcarSync("ok", "al día");
  }catch(e){
    console.error("No se pudo crear la reunión:", e);
    marcarSync("error", "no se guardó");
    flotar("No se pudo crear el evento");
  }
}

/* --- Cambiar cuál es la reunión activa --------------------------------
   Se actualiza el estado local al toque, sin esperar la nube: se conoce
   el contenido de sobra porque ya está en est.guardadas. */
async function usarReunion(r){
  est.lista = {
    id: r.id, ids: r.ids.slice(), porQuien: r.porQuien || "",
    cuando: r.actualizada || r.creada || 0, nombre: r.nombre || "",
    semis: { ...(r.semis || {}) }, fechaReunion: r.fechaReunion || r.creada || 0,
  };
  pintar();
  if (!HAY_NUBE){ flotar("Sin conexión: el cambio no se comparte"); return; }
  try{
    await fs.setDoc(fs.doc(db, "cancionero", "activa"), { reunionActivaId: r.id });
  }catch(e){
    console.error("No se pudo cambiar la reunión activa:", e);
    flotar("No se pudo cambiar el evento activo");
  }
}

/* --- Crear una reunión vacía a propósito (botón de Guardadas) --------- */
function nuevaReunion(nombre){
  const id = generarIdReunion();
  const ahora = Date.now();
  est.lista = { id, ids:[], porQuien:"", cuando:ahora, nombre, semis:{}, fechaReunion:ahora };
  pintar();
  crearReunion(id, nombre, [], {}, ahora);
}

/* --- Editar (nombre + fecha/hora) o copiar una reunión guardada -------
   Un solo panel para las dos cosas, reutilizado también para copiar:
   copiar es "crear una reunión nueva con las canciones y semis de otra,
   pero preguntando nombre y fecha igual que al editar" en vez de un
   prompt aparte. Fecha y hora usan <input type="date"> y
   <input type="time">: en el celular abren el selector nativo
   (calendario y reloj), en vez de tener que escribir el texto a mano.

   editandoReunion: la reunión que se está por renombrar/refechar.
   copiandoDesdeReunion: si el panel se abrió desde "Copiar", la reunión
   de origen; sólo uno de los dos está activo a la vez. */
let editandoReunion = null;
let copiandoDesdeReunion = null;

function abrirEditarReunion(r){
  editandoReunion = r;
  copiandoDesdeReunion = null;
  $("er-titulo").textContent = "Editar evento";
  llenarCamposReunion(r.nombre || "", r.fechaReunion || r.creada || Date.now());
  $("er-editar").classList.add("abierto");
}

/* --- Copiar una reunión guardada como punto de partida de otra --------
   Trae las canciones (y sus transportes guardados) tal cual estaban:
   sirve para repetir un enganchado que ya funcionó y sólo cambiar
   algunas canciones, en vez de rearmar la lista de cero. La reunión
   original queda intacta; la copia es un documento nuevo y pasa a ser
   la activa. La fecha sugerida es la de hoy, no la de la original: es
   una reunión distinta, se ajusta en el mismo panel antes de guardar. */
function abrirCopiarReunion(r){
  copiandoDesdeReunion = r;
  editandoReunion = null;
  $("er-titulo").textContent = "Copiar evento";
  llenarCamposReunion(r.nombre ? `${r.nombre} (copia)` : "", Date.now());
  $("er-editar").classList.add("abierto");
}

function llenarCamposReunion(nombre, ms){
  const fecha = new Date(ms);
  const pad = n => String(n).padStart(2, "0");
  $("er-nombre").value = nombre;
  $("er-fecha").value = `${fecha.getFullYear()}-${pad(fecha.getMonth()+1)}-${pad(fecha.getDate())}`;
  $("er-hora").value = `${pad(fecha.getHours())}:${pad(fecha.getMinutes())}`;
}

function cerrarEditarReunion(){
  $("er-editar").classList.remove("abierto");
  editandoReunion = null;
  copiandoDesdeReunion = null;
}

function guardarEditarReunion(){
  const nombre = $("er-nombre").value.trim();
  if (!nombre) return flotar("Falta el nombre");

  const origen = copiandoDesdeReunion || editandoReunion;
  let fechaReunion = origen.fechaReunion || origen.creada || Date.now();
  const fechaStr = $("er-fecha").value;   // aaaa-mm-dd
  if (fechaStr){
    const [anio, mes, dia] = fechaStr.split("-").map(Number);
    const [h, mi] = ($("er-hora").value || "00:00").split(":").map(Number);
    fechaReunion = new Date(anio, mes - 1, dia, h, mi).getTime();
  }

  if (copiandoDesdeReunion){
    const r = copiandoDesdeReunion;
    const id = generarIdReunion();
    const ids = r.ids.slice();
    const semis = { ...(r.semis || {}) };
    est.lista = { id, ids, porQuien:"", cuando:Date.now(), nombre, semis, fechaReunion };
    cerrarEditarReunion();
    pintar();
    crearReunion(id, nombre, ids, semis, fechaReunion);
    flotar("Evento copiado");
    return;
  }

  const r = editandoReunion;
  cerrarEditarReunion();
  guardarDatosReunion(r, nombre, fechaReunion);
}
async function guardarDatosReunion(r, nombre, fechaReunion){
  /* Si es la reunión activa, se refleja al toque en est.lista sin
     esperar la nube, igual que el resto de las acciones. */
  if (r.id === est.lista.id){ est.lista.nombre = nombre; est.lista.fechaReunion = fechaReunion; }
  const enGuardadas = est.guardadas.find(g => g.id === r.id);
  if (enGuardadas){ enGuardadas.nombre = nombre; enGuardadas.fechaReunion = fechaReunion; }
  pintar();
  if (!HAY_NUBE){ flotar("Sin conexión: no se comparte"); return; }
  try{
    await fs.setDoc(fs.doc(db, "reuniones", r.id), { nombre, fechaReunion, actualizada: Date.now() }, { merge: true });
  }catch(e){
    console.error("No se pudo guardar los datos de la reunión:", e);
    flotar("No se pudo guardar los cambios");
  }
}

/* --- Guardar una canción (editada o nueva) --------------------------- */
async function guardarCancion(cancion, esNueva){
  if (!HAY_NUBE){ flotar("Sin conexión: el cambio no se comparte"); return; }
  marcarSync("escribiendo", "guardando");
  try{
    await fs.setDoc(fs.doc(db, "canciones", cancion.id), {
      nombre: cancion.nombre,
      tono: cancion.tono,
      bpm: cancion.bpm,
      bloques: cancion.bloques,
      nueva: !!esNueva,
      borrada: false,
      cuando: Date.now(),
    });
    marcarSync("ok", "al día");
  }catch(e){
    console.error("No se pudo guardar la canción:", e);
    marcarSync("error", "no se guardó");
    flotar("No se pudo guardar el cambio");
  }
}

/* --- Marcar una canción como borrada --------------------------------
   No se elimina el documento: se marca. Así los demás dispositivos se
   enteran de que la canción ya no va; si se borrara el documento, no
   habría nada que les avise. */
async function marcarBorrada(id){
  if (!HAY_NUBE){ flotar("Sin conexión: el borrado no se comparte"); return; }
  try{
    await fs.setDoc(fs.doc(db, "canciones", id), { borrada:true, cuando:Date.now() });
    marcarSync("ok", "al día");
  }catch(e){
    console.error("No se pudo borrar:", e);
    flotar("No se pudo borrar");
  }
}

/* --- Ajustes del dispositivo ----------------------------------------
   Van en el navegador, no en la nube: el tamaño de letra es de cada uno.
   Envuelto en try porque en modo incógnito puede estar bloqueado. */
function leerAjustes(){
  try{
    const a = JSON.parse(localStorage.getItem("cancionero:ajustes") || "{}");
    if (a.tamano) est.tamano = a.tamano;
    if (a.orden) est.orden = a.orden;
  }catch(e){ /* sin ajustes guardados */ }
}
function guardarAjustes(){
  try{
    localStorage.setItem("cancionero:ajustes", JSON.stringify({
      tamano:est.tamano, orden:est.orden,
    }));
  }catch(e){ /* no se puede guardar, no es grave */ }
}


/* ===================================================================
   9. AVISOS AL USUARIO
   =================================================================== */
const $ = id => document.getElementById(id);

function marcarSync(clase, texto){
  $("punto").className = "punto " + clase;
  $("sync-txt").textContent = texto;
}

let temporizadorFlotante;
function flotar(msg){
  const f = $("flotante");
  f.textContent = msg;
  f.classList.add("visible");
  clearTimeout(temporizadorFlotante);
  temporizadorFlotante = setTimeout(()=>f.classList.remove("visible"), 2200);
}


/* ===================================================================
   10. PINTAR LA PANTALLA
   Una sola función de dibujo por pestaña. Se redibuja todo en vez de
   parchar el DOM: son 130 filas, no hace falta nada más sofisticado.
   =================================================================== */
function pintar(){
  /* contador de la pestaña Reunión */
  const n = est.lista.ids.length;
  const c = $("cuenta");
  c.style.display = n ? "inline-block" : "none";
  c.textContent = n;

  $("tab-canciones").classList.toggle("activa", est.pestana === "canciones");
  $("tab-reunion").classList.toggle("activa", est.pestana === "reunion");
  $("tab-guardadas").classList.toggle("activa", est.pestana === "guardadas");
  $("tab-online").classList.toggle("activa", est.pestana === "online");
  $("caja-buscador").style.display = est.pestana === "canciones" ? "block" : "none";
  $("caja-orden").style.display = est.pestana === "canciones" ? "flex" : "none";
  $("caja-buscador-guardadas").style.display = est.pestana === "guardadas" ? "block" : "none";

  if (est.pestana === "canciones") pintarCatalogo();
  else if (est.pestana === "guardadas") pintarGuardadas();
  else if (est.pestana === "reunion") pintarReunion();
  else pintarOnline();
}

/* --- Orden del catálogo -----------------------------------------------
   Nombre siempre alfabético (ya viene así de recalcular()). Tono y BPM
   dejan al final las canciones sin ese dato en vez de tirarlas al
   principio con "null" primero, y a igualdad de tono/bpm desempatan por
   nombre para que el orden no salte de una redibujada a otra. */
function compararNombre(a, b){
  return a.nombre.localeCompare(b.nombre, "es", {sensitivity:"base"});
}
function compararTono(a, b){
  if (!a.tono || !b.tono) return (!a.tono) - (!b.tono) || compararNombre(a, b);
  return a.tono.localeCompare(b.tono, "es", {sensitivity:"base"}) || compararNombre(a, b);
}
function compararBpm(a, b){
  if (a.bpm == null || b.bpm == null) return (a.bpm == null) - (b.bpm == null) || compararNombre(a, b);
  return (a.bpm - b.bpm) || compararNombre(a, b);
}
const COMPARADORES = { nombre: compararNombre, tono: compararTono, bpm: compararBpm };

/* --- Pestaña Canciones ---------------------------------------------- */
function pintarCatalogo(){
  const cont = $("contenido");
  cont.innerHTML = "";
  $("pie").style.display = "none";

  $("caja-orden").querySelectorAll(".orden-btn").forEach(b => {
    b.classList.toggle("activo", b.dataset.orden === est.orden);
  });

  /* Nueva canción y exportar. "Exportar" sólo aparece si hay algo que
     exportar, así no ocupa lugar cuando no hace falta. */
  const acc = document.createElement("div");
  acc.className = "acciones";
  const n = contarCambios();
  acc.innerHTML = `<button id="btn-nueva">+ Nueva canción</button>`
    + (n ? `<button class="exportar" id="btn-exportar">Exportar (${n})</button>` : "");
  cont.appendChild(acc);
  $("btn-nueva").onclick = () => abrirEditor("nueva");
  if (n) $("btn-exportar").onclick = abrirExportar;

  const q = est.filtro.trim().toLowerCase();
  const encontradas = CATALOGO.filter(s =>
    !q || s.nombre.toLowerCase().includes(q) || (s.tono || "").toLowerCase() === q
  ).sort(COMPARADORES[est.orden]);

  if (!encontradas.length){
    cont.insertAdjacentHTML("beforeend",
      `<div class="vacio"><strong>Sin resultados</strong>Probá con parte del nombre, o con el tono (G, Bm).</div>`);
    return;
  }

  /* Separador por letra si el orden es por nombre, por tono si es por
     tono. Por BPM no separa: casi todas las canciones tienen un BPM
     distinto, así que agrupar de a una no ayudaría a encontrar nada. */
  let clavePrevia = null;
  encontradas.forEach(s => {
    if (est.orden !== "bpm"){
      const clave = est.orden === "tono"
        ? (s.tono ? s.tono.toUpperCase() : "Sin tono")
        : (s.nombre[0] || "?").toUpperCase();
      if (clave !== clavePrevia){
        const sep = document.createElement("div");
        sep.className = "separador";
        sep.textContent = clave;
        cont.appendChild(sep);
        clavePrevia = clave;
      }
    }
    const puesta = est.lista.ids.includes(s.id);
    const fila = document.createElement("div");
    fila.className = "fila";
    fila.innerHTML = `
      <button class="fila-txt">
        <div class="fila-nombre">${escapar(s.nombre)}</div>
        <div class="fila-meta">${metaDe(s)}</div>
      </button>
      <button class="sumar${puesta ? " puesta" : ""}">${puesta ? "✓" : "+"}</button>`;
    fila.querySelector(".fila-txt").onclick = () => abrir(s.id, false);
    fila.querySelector(".sumar").onclick = () => alternarEnLista(s.id);
    cont.appendChild(fila);
  });
}

/* --- Pestaña Reunión ------------------------------------------------ */
function pintarReunion(){
  const cont = $("contenido");
  cont.innerHTML = "";
  const pie = $("pie");

  if (!est.lista.ids.length){
    cont.innerHTML = `<div class="vacio"><strong>Todavía no hay lista</strong>
      Tocá "+ Agregar canciones" abajo para sumar las de este domingo.
      Lo que armes acá lo ve todo el grupo.</div>`;
    pie.style.display = "flex";
    const hayTransmisionVacia = directoresActivos > 0 && !!ultimoBroadcastDirector;
    pie.innerHTML = `<button class="btn btn-fuerte" id="agregar-btn">+ Agregar canciones</button>`
      + (hayTransmisionVacia ? `<button class="btn btn-vivo" id="ver-vivo-evento">Online</button>` : "");
    $("agregar-btn").onclick = abrirAgregar;
    if (hayTransmisionVacia) $("ver-vivo-evento").onclick = () => { est.pestana = "online"; pintar(); };
    return;
  }

  /* Nombre y fecha/hora de la reunión activa: para saber de un vistazo
     cuál es y para cuándo es, sin tener que ir a Guardadas a revisar. */
  const info = document.createElement("div");
  info.style.padding = "12px 14px 6px";
  info.innerHTML = `
    <div class="fila-nombre">${escapar(est.lista.nombre || "Sin nombre")}</div>
    <div class="fila-meta">${fechaHoraTexto(est.lista.fechaReunion || est.lista.cuando || Date.now())}</div>`;
  cont.appendChild(info);

  /* Ser director se decide acá, manejando el evento. Modo Online (ver lo
     que transmite el director) vive en su propia pestaña, no acá. */
  const online = document.createElement("div");
  online.className = "orden-fila";
  online.innerHTML = `<button class="orden-btn" id="chip-director">Director${directoresActivos > 0 ? ` (${directoresActivos})` : ""}</button>`;
  cont.appendChild(online);
  $("chip-director").classList.toggle("activo", est.esDirector);
  $("chip-director").onclick = alternarDirector;

  est.lista.ids.forEach((id, i) => {
    const s = PORID[id];
    const fila = document.createElement("div");
    fila.className = "fila";
    if (!s){
      /* Puede pasar si alguien armó la lista con un catálogo más nuevo */
      fila.innerHTML = `<div class="orden">${i+1}</div>
        <div class="fila-txt"><div class="fila-nombre" style="color:var(--tenue)">Canción no encontrada</div>
        <div class="fila-meta">Actualizá el cancionero (${escapar(id)})</div></div>
        <button class="quitar">✕</button>`;
      fila.querySelector(".quitar").onclick = () => quitar(id);
      cont.appendChild(fila);
      return;
    }
    fila.innerHTML = `
      <div class="orden">${i+1}</div>
      <button class="fila-txt">
        <div class="fila-nombre">${escapar(s.nombre)}</div>
        <div class="fila-meta">${metaDe(s, semisGuardado(id))}</div>
      </button>
      <div class="mover">
        <button class="arriba" ${i === 0 ? "disabled" : ""}>▲</button>
        <button class="abajo" ${i === est.lista.ids.length-1 ? "disabled" : ""}>▼</button>
      </div>
      <button class="quitar">✕</button>`;
    fila.querySelector(".fila-txt").onclick = () => { est.posicion = i; abrir(id, true); };
    fila.querySelector(".arriba").onclick = () => mover(i, -1);
    fila.querySelector(".abajo").onclick  = () => mover(i, +1);
    fila.querySelector(".quitar").onclick = () => quitar(id);
    /* Arrastrar arranca sólo tocando la manija (▲▼), no toda la fila:
       así no compite con el scroll de la lista. Un toque corto ahí
       sigue moviendo un solo lugar, como siempre. */
    const manija = fila.querySelector(".mover");
    manija.addEventListener("touchstart", e => iniciarArrastre(e, i, fila), {passive:true});
    manija.addEventListener("mousedown", e => iniciarArrastre(e, i, fila));
    cont.appendChild(fila);
  });

  pie.style.display = "flex";
  /* El primer botón tiene tres estados, todos del mismo tamaño que los
     otros dos (nada de un botón grande y dos chicos): si hay una
     transmisión activa, "Online" para cualquiera (lleva a verla). Si no
     hay ninguna y se es director, "Transmitir" (lleva a la primera
     canción, desde ahí se transmite con el botón O). Si no hay
     transmisión y no se es director, "Offline": no hay nada para
     empezar, apagado. */
  const hayTransmision = directoresActivos > 0 && !!ultimoBroadcastDirector;
  const primerBoton = hayTransmision
    ? `<button class="btn btn-vivo" id="primer-btn">Online</button>`
    : est.esDirector
      ? `<button class="btn btn-fuerte" id="primer-btn">Transmitir</button>`
      : `<button class="btn" id="primer-btn" disabled>Offline</button>`;
  pie.innerHTML = primerBoton
    + `<button class="btn" id="agregar-btn">+ Agregar</button>
       <button class="btn" id="vaciar">Vaciar</button>`;
  if (hayTransmision) $("primer-btn").onclick = () => { est.pestana = "online"; pintar(); };
  else if (est.esDirector) $("primer-btn").onclick = transmitirDesdeElPrincipio;
  $("agregar-btn").onclick = abrirAgregar;
  $("vaciar").onclick = vaciar;
}

/* --- Panel "Agregar canciones" ----------------------------------------
   Mismo buscador y misma fila que la pestaña Canciones, pero en un panel
   aparte para no perder de vista en qué reunión se está agregando: antes
   había que ir y volver entre pestañas, y ese viaje es justo donde se
   pierde la noción de a cuál reunión se estaba sumando. */
function abrirAgregar(){
  est.filtroAgregar = "";
  $("ag-buscar").value = "";
  pintarAgregar();
  $("agregar").classList.add("abierto");
}
function cerrarAgregar(){
  $("agregar").classList.remove("abierto");
}
function pintarAgregar(){
  const cont = $("ag-lista");
  cont.innerHTML = "";
  const q = est.filtroAgregar.trim().toLowerCase();
  const encontradas = CATALOGO.filter(s =>
    !q || s.nombre.toLowerCase().includes(q) || (s.tono || "").toLowerCase() === q
  );

  if (!encontradas.length){
    cont.innerHTML = `<div class="vacio"><strong>Sin resultados</strong>Probá con parte del nombre, o con el tono (G, Bm).</div>`;
    return;
  }

  encontradas.forEach(s => {
    const puesta = est.lista.ids.includes(s.id);
    const fila = document.createElement("div");
    fila.className = "fila";
    fila.innerHTML = `
      <button class="fila-txt">
        <div class="fila-nombre">${escapar(s.nombre)}</div>
        <div class="fila-meta">${metaDe(s)}</div>
      </button>
      <button class="sumar${puesta ? " puesta" : ""}">${puesta ? "✓" : "+"}</button>`;
    /* Acá el toque suma o saca directo, sin abrir la canción: es un
       panel para armar la lista rápido, no para leer letras. */
    const alternar = () => { alternarEnLista(s.id); pintarAgregar(); };
    fila.querySelector(".fila-txt").onclick = alternar;
    fila.querySelector(".sumar").onclick = alternar;
    cont.appendChild(fila);
  });
}

/* --- Pestaña Guardadas -----------------------------------------------
   Lista de reuniones pasadas (o armadas con anticipación), siempre con
   la más nueva (o más a futuro) primero, según la fecha de reunión: es
   el único orden, sin opciones para cambiarlo. No se toca nada de lo
   que ve el escenario: sólo permite crear una reunión nueva, copiar una
   existente como punto de partida, o elegir cuál es la activa. */
function pintarGuardadas(){
  const cont = $("contenido");
  cont.innerHTML = "";
  $("pie").style.display = "none";

  const acc = document.createElement("div");
  acc.className = "acciones";
  acc.innerHTML = `<button id="btn-nueva-reunion">+ Nuevo evento</button>`;
  cont.appendChild(acc);
  $("btn-nueva-reunion").onclick = () => {
    const nombre = prompt("Nombre del evento", fechaHoyTexto());
    if (nombre === null) return;  // canceló
    nuevaReunion(nombre.trim() || fechaHoyTexto());
  };

  if (!est.guardadas.length){
    cont.insertAdjacentHTML("beforeend", `<div class="vacio">
      <strong>Todavía no hay eventos en el historial</strong>
      Se crean solos la primera vez que sumás una canción en Canciones,
      o tocá arriba "+ Nuevo evento" para armar uno con anticipación.</div>`);
    return;
  }

  const q = est.filtroGuardadas.trim().toLowerCase();
  const lista = est.guardadas
    .filter(r => !q || (r.nombre || "").toLowerCase().includes(q))
    .sort((a, b) => (b.fechaReunion || b.creada) - (a.fechaReunion || a.creada));

  if (!lista.length){
    cont.insertAdjacentHTML("beforeend",
      `<div class="vacio"><strong>Sin resultados</strong>Probá con parte del nombre.</div>`);
    return;
  }

  lista.forEach(r => {
    const activa = r.id === est.lista.id;
    const fila = document.createElement("div");
    fila.className = "fila";
    fila.innerHTML = `
      <button class="fila-txt">
        <div class="fila-nombre">${escapar(r.nombre || "Sin nombre")}${activa ? `<span class="chip-activa">Activa</span>` : ""}</div>
        <div class="fila-meta">${fechaHoraTexto(r.fechaReunion || r.creada)} · ${r.ids.length} canción${r.ids.length === 1 ? "" : "es"}</div>
      </button>
      <button class="btn-icono editar" title="Cambiar nombre y fecha">✎</button>
      <button class="btn-icono copiar" title="Copiar este evento">📋</button>`;
    /* Tocar el nombre activa la reunión (si no lo era ya) y lleva directo
       a la pestaña Reunión: hace de "Usar esta", sin ocupar un botón
       aparte en cada fila. */
    fila.querySelector(".fila-txt").onclick = () => {
      if (!activa) usarReunion(r);
      est.pestana = "reunion";
      pintar();
    };
    fila.querySelector(".editar").onclick = () => abrirEditarReunion(r);
    fila.querySelector(".copiar").onclick = () => abrirCopiarReunion(r);
    cont.appendChild(fila);
  });
}

/* --- Pestaña Online -----------------------------------------------------
   Sin pasos intermedios: si hay algo transmitido, entrar acá ya muestra
   la vista en vivo de sólo lectura (mostrarVistaOnline()); si no hay
   nada, se queda en un aviso simple. Salir es la flecha de siempre. */
/* Fondo de la pestaña Online: refleja el estado real (vacío, o "hay
   transmisión" con un botón para volver a verla), pero nunca abre nada
   sola. Se usa después de que alguien cierra la vista en vivo a
   propósito, para no forzarle a volver a entrar pero tampoco mentirle
   diciendo "vacío" si en realidad sigue habiendo transmisión. */
function fondoOnline(){
  $("pie").style.display = "none";
  const d = ultimoBroadcastDirector;
  const s = d ? PORID[d.cancionId] : null;

  if (!s){
    $("contenido").innerHTML = `<div class="vacio">
      <strong>Online vacío</strong>
      Todavía nadie que sea director eligió una canción del Evento.
      Cuando lo haga, aparece acá sola.</div>`;
    return;
  }

  $("contenido").innerHTML = `<div class="vacio">
    <strong>Hay una transmisión en vivo</strong>
    "${escapar(s.nombre)}"</div>`;
  const acc = document.createElement("div");
  acc.className = "acciones";
  acc.innerHTML = `<button id="btn-ver-vivo">Ver transmisión en vivo</button>`;
  $("contenido").appendChild(acc);
  $("btn-ver-vivo").onclick = () => mostrarVistaOnline(d);
}

/* Punto de entrada de la pestaña: dibuja el fondo y, si hay algo
   transmitido, la abre directo (para eso está la pestaña Online, no
   hace falta ningún botón de "activar"). */
function pintarOnline(){
  fondoOnline();
  const d = ultimoBroadcastDirector;
  const s = d ? PORID[d.cancionId] : null;
  if (s) mostrarVistaOnline(d);
}

/* Nombres de día abreviados, domingo primero (así coincide con
   Date.getDay()). A mano, sin toLocaleDateString, por la misma razón
   que fechaHoyTexto(): no depender de la configuración regional. */
const DIAS_SEMANA = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

/* Fecha y hora en "ddd dd/mm/aa · hh:mm", a partir de un timestamp. Se
   usa tanto para "fechaReunion" (el día en que se va a tocar, editable)
   como para mostrarle al usuario el valor actual antes de cambiarlo. El
   día de la semana adelante es para verlo de un vistazo sin tener que
   calcular qué día cae una fecha. */
function fechaHoraTexto(ms){
  const d = new Date(ms);
  const pad = n => String(n).padStart(2, "0");
  const anio = String(d.getFullYear()).slice(-2);
  return `${DIAS_SEMANA[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${anio} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* Línea "tono · bpm" de cada fila. Si el título del cancionero no trae
   tono, se dice así en vez de mostrar un dato inventado. En la pestaña
   Reunión se pasa el transporte guardado (semis) para esta reunión: así
   el resumen muestra el tono real en el que se va a tocar, no el
   original, sin tener que abrir cada canción para saberlo. */
function metaDe(s, semis){
  let tono;
  if (s.tono){
    const tonoMostrado = semis ? moverTono(s.tono, semis) : s.tono;
    tono = `<span class="tono">${escapar(tonoMostrado)}</span>`
      + (semis ? ` <span style="color:var(--tenue)">(original ${escapar(s.tono)})</span>` : "");
  } else {
    tono = `<span style="color:var(--tenue)">sin tono</span>`;
  }
  return tono + (s.bpm ? " · " + s.bpm + " bpm" : "");
}

/* Escapar texto antes de meterlo en innerHTML */
function escapar(t){
  return String(t).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
}


/* ===================================================================
   11. ACCIONES SOBRE LA LISTA
   Cada una toca el estado, redibuja y recién después guarda: la
   pantalla responde al toque sin esperar la red.
   =================================================================== */
function alternarEnLista(id){
  /* Si todavía no hay reunión activa (primer + de la reunión de hoy), se
     crea sola con la fecha de hoy como nombre. */
  const esNueva = !est.lista.id;
  if (esNueva){
    const ahora = Date.now();
    est.lista = { id: generarIdReunion(), ids:[], porQuien:"", cuando:ahora, nombre: fechaHoyTexto(), semis:{}, fechaReunion:ahora };
  }

  const i = est.lista.ids.indexOf(id);
  if (i >= 0){ est.lista.ids.splice(i,1); flotar("Sacada del evento"); }
  else { est.lista.ids.push(id); flotar("Sumada al evento"); }
  pintar();
  if (esNueva) crearReunion(est.lista.id, est.lista.nombre, est.lista.ids, est.lista.semis, est.lista.fechaReunion);
  else guardarLista();
}
function quitar(id){
  est.lista.ids = est.lista.ids.filter(x => x !== id);
  pintar(); guardarLista();
}
function mover(i, delta){
  const j = i + delta;
  if (j < 0 || j >= est.lista.ids.length) return;
  const a = est.lista.ids;
  [a[i], a[j]] = [a[j], a[i]];
  pintar(); guardarLista();
}

/* ===================================================================
   Arrastrar para reordenar el Evento. El gesto arranca sólo en la
   manija (.mover), nunca en el resto de la fila: ahí sigue andando el
   scroll normal de la lista. Se redibuja toda la pestaña en cada cruce
   de fila (no hay tantas canciones como para que pese) en vez de mover
   nodos del DOM a mano, mismo criterio que el resto de la app.
   =================================================================== */
let arrastre = null;  // { i, filaEl, startY, moviendo }

function iniciarArrastre(e, i, filaEl){
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  arrastre = { i, filaEl, startY: y, moviendo: false };
}

function moverArrastre(e){
  if (!arrastre) return;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  const dy = y - arrastre.startY;

  if (!arrastre.moviendo){
    if (Math.abs(dy) < 8) return;  // todavía puede ser sólo un toque a ▲/▼
    arrastre.moviendo = true;
    arrastre.filaEl.classList.add("arrastrando");
  }
  if (e.cancelable) e.preventDefault();  // ya es arrastre: no scrollea la página
  arrastre.filaEl.style.transform = `translateY(${dy}px)`;

  const filas = $("contenido").querySelectorAll(".fila");
  const alto = arrastre.filaEl.offsetHeight || 1;
  const objetivo = Math.max(0, Math.min(filas.length - 1, arrastre.i + Math.round(dy / alto)));
  if (objetivo !== arrastre.i){
    const a = est.lista.ids;
    const [id] = a.splice(arrastre.i, 1);
    a.splice(objetivo, 0, id);
    arrastre.i = objetivo;
    arrastre.startY = y;
    pintarReunion();
    arrastre.filaEl = $("contenido").querySelectorAll(".fila")[objetivo];
    arrastre.filaEl.classList.add("arrastrando");
  }
}

function soltarArrastre(){
  if (!arrastre) return;
  const huboArrastre = arrastre.moviendo;
  if (arrastre.filaEl){
    arrastre.filaEl.classList.remove("arrastrando");
    arrastre.filaEl.style.transform = "";
  }
  arrastre = null;
  if (huboArrastre) guardarLista();
}
function vaciar(){
  if (!confirm("¿Vaciar la lista del evento? Se borra también para el resto del grupo.")) return;
  est.lista.ids = [];
  pintar(); guardarLista();
}


/* ===================================================================
   12. LECTOR
   =================================================================== */
/* Transporte guardado para esta canción en la reunión activa, si lo hay.
   No depende de si el lector está abierto: también lo usa el resumen de
   la pestaña Reunión, para mostrar el tono real sin abrir cada canción. */
function semisGuardado(id){
  return (est.lista.semis && est.lista.semis[id]) || 0;
}

/* Se llama después de tocar ♭/♯ en el lector. Fuera de modo reunión no
   hace nada: ahí el transporte sigue siendo de sesión, como siempre.
   Si el transporte vuelve a 0 (mismo tono original), se saca la entrada
   en vez de guardar un 0: así el mapa sólo tiene lo que de verdad
   cambió, y no crece con cada canción que se abrió. */
function guardarSemisSiCorresponde(){
  if (!est.enReunion || !est.abierta || !est.lista.id) return;
  est.lista.semis = est.lista.semis || {};
  if (est.semis) est.lista.semis[est.abierta] = est.semis;
  else delete est.lista.semis[est.abierta];
  guardarLista();
}

function abrir(id, enReunion){
  est.abierta = id;
  est.enReunion = enReunion;
  est.soloLectura = false;  // abrir algo por cuenta propia siempre sale del modo sólo lectura
  est.semis = enReunion ? semisGuardado(id) : 0;
  $("lector").classList.add("abierto");
  $("cuerpo").scrollTop = 0;
  pintarLector();
  /* No se transmite sola: el director mira canciones libremente y
     transmite a propósito con el botón O. */
}
function cerrar(){
  $("lector").classList.remove("abierto");
  est.abierta = null;
  est.soloLectura = false;
}

/* Lo que efectivamente toca el botón ← del lector: además de cerrar, si
   se estaba mirando la vista en vivo manda al listado del Evento (sea o
   no director), en vez de dejar a alguien parado en la pestaña Online,
   que ahí no tiene nada más para hacer. */
function cerrarLector(){
  const veniaDeSoloLectura = est.soloLectura;
  cerrar();
  if (!veniaDeSoloLectura) return;
  est.pestana = "reunion";
  pintar();
}

function pintarLector(){
  const s = PORID[est.abierta];
  if (!s) return cerrar();

  /* Sin tono en el título no hay transporte posible: no se puede saber
     desde dónde se mueve. Se apagan los botones en vez de adivinar. */
  const puedeTransportar = !!s.tono;
  const tonoActual = puedeTransportar ? moverTono(s.tono, est.semis) : null;

  $("l-nombre").textContent = s.nombre;
  $("l-meta").innerHTML = (puedeTransportar
      ? `<b>${escapar(tonoActual)}</b>`
        + (est.semis ? ` <span style="color:var(--tenue)">(original ${escapar(s.tono)}, ${est.semis > 0 ? "+" : ""}${est.semis})</span>` : "")
      : `<span style="color:var(--tenue)">sin tono en el cancionero</span>`)
    + (s.bpm ? ` · ${s.bpm} bpm` : "");

  /* Modo sólo lectura (viendo la transmisión desde Online): sin
     transportar, sin editar, sin tocar el riel. Pero si esta misma
     persona también es director, no se le apaga nada: sigue teniendo
     control completo, esté mirando lo que esté mirando. Los bloqueos
     son sólo para quien mira sin ser director. */
  const bloqueado = est.soloLectura && !est.esDirector;
  ["mas-t","menos-t"].forEach(k => {
    $(k).disabled = !puedeTransportar || bloqueado;
    $(k).style.opacity = (puedeTransportar && !bloqueado) ? "" : ".25";
    $(k).classList.toggle("on", puedeTransportar && est.semis !== 0);
  });
  $("dir-toggle").style.display = bloqueado ? "none" : "";
  $("dir-toggle").classList.toggle("on", est.esDirector);
  $("editar").style.display = bloqueado ? "none" : "";
  /* Visible para cualquiera en la vista en vivo, sea o no director: es
     un botón de emergencia por si alguien se fue sin apagar Director y
     quedó una canción vieja pegada para todos. */
  $("vaciar-transmision").style.display = est.soloLectura ? "" : "none";

  /* Botón O: visible para el director en cualquier canción del evento
     (para poder transmitirla a propósito) y para cualquiera que esté en
     la vista en vivo (ahí, sólo como indicador). Verde cuando la
     canción que se ve es justo la que está en vivo. */
  const enVivo = !!(ultimoBroadcastDirector && ultimoBroadcastDirector.cancionId === est.abierta);
  const mostrarOnline = (est.esDirector && est.enReunion) || est.soloLectura;
  $("online-badge").style.display = mostrarOnline ? "" : "none";
  $("online-badge").classList.toggle("en-vivo", enVivo);
  $("online-badge").disabled = !est.esDirector;
  $("online-badge").title = est.esDirector
    ? (enVivo ? "Se está transmitiendo esta canción" : "Transmitir esta canción")
    : "Vista Online: la ven todos los que estén siguiendo";

  /* Escritura con bemoles si el tono destino lo pide */
  const conBemoles = puedeTransportar && TONOS_BEMOL.has(tonoActual);

  /* Cuerpo: un div por bloque, respetando el orden del cancionero */
  const cuerpo = $("cuerpo");
  cuerpo.style.fontSize = est.tamano + "px";
  pintarBloques(cuerpo, s.bloques, est.semis, conBemoles);

  /* Riel: sólo en modo reunión. Bloqueado, se ve la posición pero no se
     puede tocar. */
  const riel = $("riel"), pie = $("l-pie");
  riel.classList.toggle("visible", est.enReunion);
  if (est.enReunion){
    riel.innerHTML = "";
    est.lista.ids.forEach((id, i) => {
      const b = document.createElement("button");
      b.textContent = i + 1;
      b.className = i === est.posicion ? "aqui" : (i < est.posicion ? "pasada" : "");
      if (!bloqueado) b.onclick = () => {
        est.posicion = i; est.abierta = id; est.semis = semisGuardado(id);
        $("cuerpo").scrollTop = 0; pintarLector();
      };
      riel.appendChild(b);
    });
  }

  /* Tarjeta "Siguiente": bloqueado la deja ver (para saber qué sigue)
     pero sin poder tocarla, ni el riel cambia sola de canción. */
  pie.classList.toggle("visible", est.enReunion);
  if (est.enReunion){
    const idSig = est.lista.ids[est.posicion + 1];
    const sig = idSig ? PORID[idSig] : null;
    if (sig){
      pie.innerHTML = `<button class="btn siguiente-info"${bloqueado ? " disabled" : ""}>
        <div class="si-etiqueta">Siguiente</div>
        <div class="fila-nombre">${escapar(sig.nombre)}</div>
        <div class="fila-meta">${metaDe(sig, semisGuardado(idSig))}</div>
      </button>`;
      if (!bloqueado) pie.querySelector(".siguiente-info").onclick = () => paso(+1);
    } else {
      pie.innerHTML = `<div class="si-fin">Última canción del evento</div>`;
    }
    actualizarPieCercaFin();
  }
}

/* Decide si mostrar la tarjeta "Siguiente": sólo cuando se llegó al
   final del scroll, o cuando la canción es tan corta que ni entra
   scroll (si no, nunca se podría llegar a ver). */
function actualizarPieCercaFin(){
  if (!est.enReunion) return;
  const cuerpo = $("cuerpo");
  const noScrollea = cuerpo.scrollHeight <= cuerpo.clientHeight + 4;
  const cercaFin = noScrollea || (cuerpo.scrollTop + cuerpo.clientHeight >= cuerpo.scrollHeight - 24);
  $("l-pie").classList.toggle("cerca-fin", cercaFin);
}

function paso(delta){
  if (est.soloLectura && !est.esDirector) return;  // sin ser director, no navega desde la vista en vivo
  const j = est.posicion + delta;
  if (j < 0 || j >= est.lista.ids.length) return;
  est.posicion = j;
  est.abierta = est.lista.ids[j];
  est.semis = semisGuardado(est.abierta);
  $("cuerpo").scrollTop = 0;
  pintarLector();
}


/* ===================================================================
   12b. EDITOR DE CANCIONES
   El cuerpo se edita como texto plano en una tipografía monoespaciada:
   es la única forma de que quien edita vea y controle los espacios que
   alinean el acorde sobre la sílaba. La vista previa de abajo usa la
   misma función de dibujado que el lector, así no hay sorpresas.
   =================================================================== */
const RE_TONO_VALIDO = /^[A-G](#|b)?(m|maj|min)?[0-9]*$/;

function abrirEditor(id){
  est.editando = id;
  const nueva = (id === "nueva");
  const s = nueva ? null : PORID[id];
  if (!nueva && !s) return;

  $("ed-titulo").textContent = nueva ? "Nueva canción" : "Editar canción";
  $("ed-nombre").value = nueva ? "" : s.nombre;
  $("ed-tono").value   = nueva ? "" : (s.tono || "");
  $("ed-bpm").value    = nueva ? "" : (s.bpm || "");
  $("ed-cuerpo").value = nueva ? "" : bloquesATexto(s.bloques);
  $("ed-borrar").style.display = nueva ? "none" : "block";

  $("editor").classList.add("abierto");
  refrescarPrevia();
  actualizarBotonesTransporteEditor();
}

function cerrarEditor(){
  $("editor").classList.remove("abierto");
  est.editando = null;
}

/* Vista previa en vivo: se redibuja en cada tecla. Son pocas líneas, no
   hace falta esperar a que el usuario deje de escribir. */
function refrescarPrevia(){
  const bloques = textoABloques($("ed-cuerpo").value);
  const tono = $("ed-tono").value.trim();
  pintarBloques($("ed-previa"), bloques, 0, /^(F|Bb|Eb|Ab|Db|Gb)m?$/.test(tono));
}

/* Sin un tono válido no se sabe desde dónde transportar (mismo motivo
   que en el lector), así que los botones quedan apagados. */
function actualizarBotonesTransporteEditor(){
  const tono = $("ed-tono").value.trim();
  const ok = !!tono && RE_TONO_VALIDO.test(tono);
  ["ed-bemol","ed-sostenido"].forEach(k => {
    $(k).disabled = !ok;
    $(k).style.opacity = ok ? "" : ".25";
  });
}

/* --- Transportar el original --------------------------------------------
   A diferencia del transporte del lector (de sesión, o guardado por
   reunión), esto reescribe de verdad los acordes y el tono: es la forma
   de corregir el tono de una canción cuando se cargó mal, o de dejarla
   permanentemente en otro tono. Reusa moverLinea/moverTono, los mismos
   que usa el lector, así el resultado es idéntico al que ya se ve ahí. */
function transportarEditor(delta){
  const tonoActual = $("ed-tono").value.trim();
  if (!tonoActual || !RE_TONO_VALIDO.test(tonoActual)){
    flotar("Poné un tono válido antes de transportar");
    return;
  }
  const nuevoTono = moverTono(tonoActual, delta);
  const conBemoles = TONOS_BEMOL.has(nuevoTono);
  const bloques = textoABloques($("ed-cuerpo").value);
  bloques.forEach(b => { if (b.t === "a") b.v = moverLinea(b.v, delta, conBemoles); });

  $("ed-tono").value = nuevoTono;
  $("ed-cuerpo").value = bloquesATexto(bloques);
  refrescarPrevia();
  flotar(`Transportado a ${nuevoTono}`);
}

async function guardarEditor(){
  const nombre = $("ed-nombre").value.trim();
  const tono = $("ed-tono").value.trim();
  const bpmTxt = $("ed-bpm").value.trim();
  const bloques = textoABloques($("ed-cuerpo").value);

  /* Validaciones: se avisa y no se guarda, en vez de guardar algo a medias */
  if (!nombre) return flotar("Falta el nombre de la canción");
  if (tono && !RE_TONO_VALIDO.test(tono)) return flotar(`"${tono}" no parece un tono`);
  if (!bloques.length) return flotar("La canción no tiene contenido");

  const nueva = (est.editando === "nueva");
  const id = nueva ? nuevoId(nombre, tono) : est.editando;
  const cancion = {
    id, nombre,
    tono: tono || null,
    bpm: bpmTxt ? parseInt(bpmTxt, 10) : null,
    bloques,
  };

  est.cambios.editados = est.cambios.editados || {};
  est.cambios.nuevas = est.cambios.nuevas || [];

  const iNueva = est.cambios.nuevas.findIndex(c => c.id === id);
  if (nueva || iNueva >= 0){
    /* Canción agregada desde la app: vive en la lista de nuevas */
    if (iNueva >= 0) est.cambios.nuevas[iNueva] = cancion;
    else est.cambios.nuevas.push(cancion);
  } else {
    /* Canción que viene del .docx: se guarda la versión editada encima */
    est.cambios.editados[id] = cancion;
  }

  recalcular();
  cerrarEditor();
  pintar();
  if (est.abierta === id) pintarLector();
  flotar(nueva ? "Canción agregada" : "Cambios guardados");
  /* Se escribe sólo esta canción, en su propio documento */
  await guardarCancion(cancion, nueva || iNueva >= 0);
}

async function borrarCancion(){
  const id = est.editando;
  const s = PORID[id];
  if (!s) return;
  if (!confirm(`¿Borrar "${s.nombre}" del cancionero? Se borra para todo el grupo.`)) return;

  est.cambios.borradas = Array.from(new Set((est.cambios.borradas || []).concat([id])));
  est.cambios.nuevas = (est.cambios.nuevas || []).filter(c => c.id !== id);
  if (est.cambios.editados) delete est.cambios.editados[id];
  est.lista.ids = est.lista.ids.filter(x => x !== id);

  recalcular();
  cerrarEditor();
  cerrar();
  pintar();
  flotar("Canción borrada");
  await marcarBorrada(id);
  await guardarLista();   // por si estaba en la lista de la reunión
}

/* ===================================================================
   12c. EXPORTAR
   Saca solamente la capa de cambios, no el cancionero entero: es lo que
   hace falta para volcarlo al .docx, y es lo bastante corto para pegarlo
   en un mensaje.
   =================================================================== */
function abrirExportar(){
  const c = est.cambios;
  const nEd = Object.keys(c.editados || {}).length;
  const nNu = (c.nuevas || []).length;
  const nBo = (c.borradas || []).length;

  const partes = [];
  if (nEd) partes.push(`${nEd} editada${nEd > 1 ? "s" : ""}`);
  if (nNu) partes.push(`${nNu} nueva${nNu > 1 ? "s" : ""}`);
  if (nBo) partes.push(`${nBo} borrada${nBo > 1 ? "s" : ""}`);
  $("ex-meta").textContent = partes.join(" · ");

  $("ex-ayuda").innerHTML = "Copiá todo esto y pegámelo en el chat. Con eso "
    + "actualizo el <b>.docx</b> del cancionero. No incluye las canciones "
    + "que no tocaron: sólo lo que cambió.";

  $("ex-texto").value = JSON.stringify({
    origen: "cancionero __VERSION__",
    exportado: new Date().toISOString(),
    cambios: est.cambios,
  }, null, 1);

  $("exportar").classList.add("abierto");
}

async function copiarExportado(){
  const t = $("ex-texto");
  try{
    await navigator.clipboard.writeText(t.value);
    flotar("Copiado");
  }catch(e){
    /* Si el portapapeles está bloqueado, al menos queda seleccionado */
    t.focus(); t.select();
    flotar("Seleccionado: copialo a mano");
  }
}

/* ===================================================================
   13. CONEXIONES DE LA INTERFAZ
   =================================================================== */
$("tab-canciones").onclick  = () => { est.pestana = "canciones"; pintar(); };
$("tab-reunion").onclick    = () => { est.pestana = "reunion"; pintar(); };
$("tab-guardadas").onclick  = () => { est.pestana = "guardadas"; pintar(); };
$("tab-online").onclick     = () => { est.pestana = "online"; pintar(); };
$("buscar").oninput = e => { est.filtro = e.target.value; pintarCatalogo(); };
$("bg-buscar").oninput = e => { est.filtroGuardadas = e.target.value; pintarGuardadas(); };
$("caja-orden").querySelectorAll(".orden-btn").forEach(b => {
  b.onclick = () => { est.orden = b.dataset.orden; guardarAjustes(); pintarCatalogo(); };
});

$("cerrar").onclick = cerrarLector;

/* Editor */
$("editar").onclick      = () => { if (est.abierta) abrirEditor(est.abierta); };
$("ed-cancelar").onclick = cerrarEditor;
$("ed-guardar").onclick  = guardarEditor;
$("ed-borrar").onclick   = borrarCancion;
$("ed-cuerpo").oninput   = refrescarPrevia;
$("ed-tono").oninput     = () => { refrescarPrevia(); actualizarBotonesTransporteEditor(); };
$("ed-bemol").onclick     = () => transportarEditor(-1);
$("ed-sostenido").onclick = () => transportarEditor(+1);

/* Exportación */
$("ex-cerrar").onclick = () => $("exportar").classList.remove("abierto");
$("ex-copiar").onclick = copiarExportado;

/* Panel "Agregar canciones" */
$("ag-cerrar").onclick = cerrarAgregar;
$("ag-buscar").oninput = e => { est.filtroAgregar = e.target.value; pintarAgregar(); };

/* Panel "Editar reunión" (nombre y fecha/hora) */
$("er-cancelar").onclick = cerrarEditarReunion;
$("er-guardar").onclick = guardarEditarReunion;
$("mas-t").onclick   = () => {
  if (!PORID[est.abierta] || !PORID[est.abierta].tono) return;
  est.semis = Math.min(11, est.semis + 1); pintarLector(); guardarSemisSiCorresponde(); retransmitirSiYaEstaEnVivo();
};
$("menos-t").onclick = () => {
  if (!PORID[est.abierta] || !PORID[est.abierta].tono) return;
  est.semis = Math.max(-11, est.semis - 1); pintarLector(); guardarSemisSiCorresponde(); retransmitirSiYaEstaEnVivo();
};
$("mas-a").onclick   = () => { est.tamano = Math.min(30, est.tamano + 1); pintarLector(); guardarAjustes(); };
$("menos-a").onclick = () => { est.tamano = Math.max(11, est.tamano - 1); pintarLector(); guardarAjustes(); };
$("dir-toggle").onclick = alternarDirector;
$("vaciar-transmision").onclick = vaciarTransmision;
$("online-badge").onclick = () => { if (est.esDirector) transmitirEstado(); };

/* --- Pantalla completa ---------------------------------------------------
   Gana el alto que ocupan las barras del navegador o del visor. Puede no
   estar permitida según desde dónde se abra la app, así que se avisa. */
async function alternarPantallaCompleta(){
  try{
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){
    flotar("Acá no se permite pantalla completa");
  }
}
$("expandir").onclick = alternarPantallaCompleta;
document.addEventListener("fullscreenchange", () => {
  const activo = !!document.fullscreenElement;
  $("expandir").classList.toggle("activo", activo);
  $("expandir").textContent = activo ? "⛶" : "⛶";
});

/* Teclado: cómodo si alguien lo abre en la compu del ensayo */
document.addEventListener("keydown", e => {
  if (!$("lector").classList.contains("abierto")) return;
  if (e.key === "Escape") cerrarLector();
  if (est.enReunion && e.key === "ArrowRight") paso(+1);
  if (est.enReunion && e.key === "ArrowLeft")  paso(-1);
});

/* Mostrar la tarjeta "Siguiente" recién al llegar al final del scroll */
$("cuerpo").addEventListener("scroll", actualizarPieCercaFin, {passive:true});

/* Deslizar para pasar de canción en modo reunión */
let xIni = null, yIni = null;
$("cuerpo").addEventListener("touchstart", e => {
  xIni = e.touches[0].clientX; yIni = e.touches[0].clientY;
}, {passive:true});
$("cuerpo").addEventListener("touchend", e => {
  if (xIni === null || !est.enReunion) return;
  const dx = e.changedTouches[0].clientX - xIni;
  const dy = e.changedTouches[0].clientY - yIni;
  /* Sólo si el gesto es claramente horizontal, para no pelear con el scroll */
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) paso(dx < 0 ? +1 : -1);
  xIni = yIni = null;
}, {passive:true});

/* Arrastrar filas del Evento (ver iniciarArrastre/moverArrastre): estos
   se escuchan una sola vez, en el documento, porque el dedo se puede ir
   de la manija mientras arrastra. touchmove no puede ser pasivo: hay
   que poder frenar el scroll de la página una vez que el arrastre ya
   arrancó. */
document.addEventListener("touchmove", moverArrastre, {passive:false});
document.addEventListener("touchend", soltarArrastre);
document.addEventListener("mousemove", moverArrastre);
document.addEventListener("mouseup", soltarArrastre);


/* ===================================================================
   14. ARRANQUE
   Se dibuja primero con el catálogo local, que es instantáneo y no depende
   de la red. Después se conecta y se queda escuchando: cuando llegan la
   lista y las ediciones, la pantalla se actualiza sola.
   =================================================================== */
async function arrancar(){
  marcarSync("", "conectando");
  leerAjustes();
  recalcular();          // catálogo base, sin cambios todavía
  pintar();              // se ve el cancionero al instante, sin esperar la red
  if (await conectar()) escuchar();   // a partir de acá los cambios llegan solos
}
arrancar();

/* Antes acá había un sondeo cada 4 segundos. Ya no hace falta: onSnapshot
   avisa en el momento en que alguien cambia algo. */
</script>
