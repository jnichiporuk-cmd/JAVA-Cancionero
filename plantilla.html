<meta charset="utf-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1116">
<title>Cancionero</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<!--
  CANCIONERO — app de escenario
  ------------------------------------------------------------------
  Paleta y tipografía heredadas de la guía de formato del cancionero:
  acordes en 00B0F0, rótulos en gris, letra en blanco. Fondo oscuro
  porque se lee en el celular arriba del escenario, con luz baja.
-->
<style>
/* ===================================================================
   1. TOKENS
   Un solo lugar para colores y medidas. El cian 00B0F0 es el mismo
   hex que usan los acordes en el .docx: la app y el papel se ven
   igual. El ámbar es sólo para "organización" (lista de la reunión),
   nunca para música. Así el color dice qué tipo de cosa es.
   =================================================================== */
:root{
  --fondo:#0E1116;
  --superficie:#171C24;
  --superficie-alta:#1F2632;
  --borde:#2A3240;
  --letra:#E8EDF2;
  --acordes:#00B0F0;
  --rotulo:#BFBFBF;
  --tenue:#7C8794;
  --lista:#F2A33C;
  --peligro:#FF6B6B;

  /* Condensada para la interfaz: entra más texto en pantallas angostas.
     Intenta primero la fuente del cancionero, después alternativas. */
  --ui:"Arial Nova Cond","Arial Narrow","Roboto Condensed","Helvetica Neue Condensed",system-ui,sans-serif;
  /* Monoespaciada para el cuerpo de la canción: es lo único que
     mantiene los acordes alineados sobre la sílaba correcta. */
  --mono:ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--fondo);color:var(--letra);
  font-family:var(--ui);font-size:16px;line-height:1.35;
  overscroll-behavior:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font-family:inherit;font-size:inherit}

/* ===================================================================
   2. ENCABEZADO Y ESTADO DE SINCRONIZACIÓN
   El punto de la derecha es el único indicador de que la lista es
   compartida: verde = al día, ámbar = escribiendo, rojo = sin guardar.
   =================================================================== */
.tope{
  position:sticky;top:0;z-index:20;background:var(--fondo);
  border-bottom:1px solid var(--borde);
}
.tope-fila{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.ver{
  margin-left:6px;padding:1px 5px;border-radius:4px;
  background:var(--superficie-alta);color:var(--tenue);
  font-size:10px;letter-spacing:.06em;font-weight:700;
}
.marca{
  font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--tenue);flex:1;
}
.expandir{
  flex:none;width:30px;height:30px;border-radius:7px;
  border:1px solid var(--borde);color:var(--tenue);font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
.expandir.activo{color:var(--acordes);border-color:var(--acordes)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tenue)}
.punto{width:8px;height:8px;border-radius:50%;background:var(--tenue);flex:none}
.punto.ok{background:#3DD68C}
.punto.escribiendo{background:var(--lista)}
.punto.error{background:var(--peligro)}

/* Pestañas: Canciones, Reunión (la activa) y Guardadas (reuniones pasadas) */
.pestanas{display:flex;gap:0;padding:0 14px}
.pestana{
  padding:9px 0;margin-right:22px;font-size:15px;font-weight:600;
  color:var(--tenue);border-bottom:2px solid transparent;
}
.pestana.activa{color:var(--letra);border-bottom-color:var(--acordes)}
.pestana .cuenta{
  display:inline-block;min-width:19px;padding:0 5px;margin-left:5px;
  font-size:12px;line-height:19px;text-align:center;
  border-radius:10px;background:var(--lista);color:#12161C;font-weight:700;
}

/* Buscador */
.buscador{padding:10px 14px 12px}
.buscador input{
  width:100%;padding:11px 13px;border-radius:9px;
  background:var(--superficie);border:1px solid var(--borde);
  color:var(--letra);outline:none;
}
.buscador input:focus{border-color:var(--acordes)}
.buscador input::placeholder{color:var(--tenue)}

/* Orden del catálogo: Nombre / Tono / BPM. Chips en vez de un <select>
   para que cambiar de orden sea un solo toque, sin abrir nada. */
.orden-fila{display:flex;gap:8px;padding:0 14px 10px}
.orden-btn{
  flex:1;padding:7px 0;border-radius:7px;border:1px solid var(--borde);
  font-size:13px;font-weight:600;color:var(--tenue);text-align:center;
}
.orden-btn.activo{color:var(--acordes);border-color:var(--acordes)}

/* ===================================================================
   3. LISTA DE CANCIONES DEL CATÁLOGO
   Cada fila: nombre + tono + bpm, y a la derecha el botón para
   sumarla a la reunión. Tocar el nombre abre la canción.
   =================================================================== */
.contenido{padding:0 0 90px}
.fila{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-bottom:1px solid var(--borde);
}
.fila-txt{flex:1;min-width:0;text-align:left}
.fila-nombre{
  font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.fila-meta{font-size:12px;color:var(--tenue);margin-top:2px}
.fila-meta .tono{color:var(--acordes);font-weight:700}
.sumar{
  flex:none;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--borde);font-size:20px;line-height:1;color:var(--tenue);
}
.sumar.puesta{border-color:var(--lista);color:var(--lista)}

/* Fila de una reunión guardada: sólo el nombre (con un chip si es la
   activa) e íconos chicos para renombrar y copiar. Sin botón "Usar
   esta": tocar el nombre ya hace eso, y de paso lleva a Reunión. */
.chip-activa{
  display:inline-block;margin-left:7px;padding:1px 7px;border-radius:9px;
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(0,176,240,.15);color:var(--acordes);border:1px solid var(--acordes);
  vertical-align:middle;
}
.btn-icono{
  flex:none;width:30px;height:30px;border-radius:7px;
  border:1px solid var(--borde);font-size:14px;color:var(--tenue);
  display:flex;align-items:center;justify-content:center;
}

/* ===================================================================
   4. REUNIÓN (armador de lista)
   Reordenar con flechas en vez de arrastrar: en el celular, arrastrar
   dentro de una lista con scroll falla seguido. Las flechas no fallan.
   =================================================================== */
.orden{
  flex:none;width:26px;text-align:center;
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--lista);
}
.mover{display:flex;flex-direction:column;gap:2px;flex:none;touch-action:none}
.mover button{
  width:30px;height:22px;border:1px solid var(--borde);border-radius:5px;
  font-size:10px;color:var(--tenue);display:flex;align-items:center;justify-content:center;
}
.mover button:disabled{opacity:.25}
.quitar{flex:none;width:30px;height:30px;color:var(--tenue);font-size:17px}
.fila.arrastrando{position:relative;z-index:5;background:var(--superficie-alta);box-shadow:0 4px 14px rgba(0,0,0,.45)}

.separador{
  padding:9px 14px 5px;font-size:11px;font-weight:700;
  letter-spacing:.2em;color:var(--tenue);
  background:var(--fondo);border-bottom:1px solid var(--borde);
  position:sticky;top:0;z-index:5;
}
.vacio{padding:44px 26px;text-align:center;color:var(--tenue)}
.vacio strong{display:block;color:var(--letra);font-size:17px;margin-bottom:7px;font-weight:600}

.pie-reunion{
  position:fixed;bottom:0;left:0;right:0;z-index:15;
  display:flex;gap:9px;padding:11px 14px 15px;
  background:linear-gradient(to top,var(--fondo) 65%,transparent);
}
.btn{
  flex:1;padding:13px;border-radius:9px;font-weight:700;font-size:15px;
  text-align:center;border:1px solid var(--borde);color:var(--letra);
}
.btn-fuerte{background:var(--acordes);color:#08121A;border-color:var(--acordes)}
.btn-suave{flex:none;padding:13px 15px;color:var(--tenue)}
.btn-vivo{border-color:#3DD68C;color:#3DD68C}
.btn:disabled{opacity:.5;cursor:default}

/* Aviso del catálogo de prueba. Se borra junto con los datos falsos. */
.aviso{
  margin:12px 14px;padding:10px 12px;border-radius:8px;
  background:rgba(242,163,60,.1);border:1px solid rgba(242,163,60,.35);
  color:var(--lista);font-size:13px;line-height:1.4;
}

/* ===================================================================
   5. LECTOR DE CANCIÓN
   Pantalla completa. En modo reunión aparece arriba el riel numerado
   con las canciones de la lista, que es el mapa de por dónde vamos.
   =================================================================== */
.lector{
  position:fixed;inset:0;z-index:40;background:var(--fondo);
  display:none;flex-direction:column;
}
.lector.abierto{display:flex}

.lector-tope{border-bottom:1px solid var(--borde);flex:none}
.lector-barra{display:flex;align-items:center;gap:10px;padding:11px 12px}
.cerrar{flex:none;width:32px;height:32px;font-size:20px;color:var(--tenue)}
.lector-tit{flex:1;min-width:0}
.lector-nombre{
  font-size:17px;font-weight:700;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lector-meta{font-size:12px;color:var(--tenue);margin-top:1px}
.lector-meta b{color:var(--acordes)}

/* Controles de tamaño y transporte */
.ctrl{display:flex;align-items:center;gap:4px;flex:none}
.ctrl button{
  width:28px;height:31px;border:1px solid var(--borde);border-radius:7px;
  font-size:13px;font-weight:700;color:var(--tenue);
  display:flex;align-items:center;justify-content:center;
}
.ctrl button.on{color:var(--acordes);border-color:var(--acordes)}

/* Botón/indicador "O": para el director, transmite esta canción a
   propósito (apagado = no es la que está en vivo; verde = sí lo es).
   Para quien sólo sigue, es un indicador fijo en verde. Mismo formato
   que los botones de .ctrl (D, ♭, ♯...). */
.online-badge{
  width:28px;height:31px;border:1px solid var(--borde);border-radius:7px;
  font-size:13px;font-weight:700;color:var(--tenue);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.online-badge.en-vivo{border-color:#3DD68C;color:#3DD68C}

/* Riel de la reunión: sólo visible cuando entrás por "Empezar" */
.riel{display:none;gap:6px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.riel::-webkit-scrollbar{display:none}
.riel.visible{display:flex}
.riel button{
  flex:none;width:27px;height:27px;border-radius:50%;
  border:1px solid var(--borde);font-family:var(--mono);font-size:12px;
  color:var(--tenue);
}
.riel button.aqui{background:var(--lista);border-color:var(--lista);color:#12161C;font-weight:700}
.riel button.pasada{opacity:.4}

/* Cuerpo de la canción.
   pre-wrap + monoespaciada = los acordes caen sobre la sílaba justa.
   Si una línea es más ancha que la pantalla, se puede scrollear al
   costado en vez de romper la alineación con un salto de línea. */
.cuerpo{flex:1;overflow-y:auto;padding:16px 14px 120px}
/* letter-spacing negativo angosta el texto sin tocar la fuente. Se
   aplica igual en acordes y letra (los dos heredan de .bloque), así que
   la alineación entre columnas no se rompe: cada carácter, incluidos los
   espacios, se angosta lo mismo en las dos líneas. */
.bloque{font-family:var(--mono);white-space:pre;margin:0;letter-spacing:-.05em}
.b-acordes{color:var(--acordes)}
.b-letra{color:var(--letra)}
.b-rotulo{
  font-family:var(--ui);font-style:italic;color:var(--rotulo);
  white-space:normal;margin:15px 0 4px;font-size:.95em;
}
.bloque:first-child.b-rotulo{margin-top:0}
.b-vacio{height:.8em}
.scrollx{overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}

/* Aviso de la próxima canción en modo reunión. Reemplaza los botones
   Anterior/Siguiente: para cambiar de canción se desliza para el
   costado (o se toca esta misma tarjeta), y acá se ve de antemano el
   nombre, tono y bpm de la que sigue. Sólo aparece al llegar al final
   de la letra (o si la canción es corta y no hay ni que scrollear):
   mientras se está leyendo, no tapa las últimas líneas. */
.lector-pie{
  position:absolute;bottom:0;left:0;right:0;
  display:none;gap:9px;padding:11px 14px 16px;
  background:linear-gradient(to top,var(--fondo) 65%,transparent);
}
.lector-pie.visible.cerca-fin{display:flex}
.siguiente-info:disabled{opacity:.6;cursor:default}
.si-etiqueta{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tenue);margin-bottom:3px;
}
.si-fin{flex:1;padding:13px;text-align:center;color:var(--tenue);font-size:14px}

/* ===================================================================
   EDITOR Y EXPORTACIÓN
   Reusan la caja del lector (.lector) para no duplicar la lógica de
   pantalla completa; sólo cambia el contenido.
   =================================================================== */
.btn-guardar{
  flex:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:14px;
  background:var(--acordes);color:#08121A;
}
.btn-ancho{width:100%;padding:13px;margin-top:12px}
.ed-cuerpo{flex:1;overflow-y:auto;padding:14px 14px 40px}
.agregar-lista{flex:1;overflow-y:auto;padding-bottom:40px}
.ed-campos label{display:block;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tenue);margin-bottom:11px}
.ed-campos input{
  display:block;width:100%;margin-top:5px;padding:10px 12px;border-radius:8px;
  background:var(--superficie);border:1px solid var(--borde);color:var(--letra);
  font-size:16px;outline:none;
}
.ed-campos input:focus{border-color:var(--acordes)}
#er-fecha,#er-hora{color-scheme:dark}
.ed-fila2{display:flex;gap:10px}
.ed-fila2 label{flex:1}
.ed-transportar{
  display:flex;align-items:center;gap:8px;margin:12px 0 16px;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);
}
.ed-transportar button{
  width:30px;height:30px;border:1px solid var(--borde);border-radius:7px;
  font-size:14px;color:var(--tenue);display:flex;align-items:center;justify-content:center;
}
.ed-ayuda{
  padding:9px 11px;margin-bottom:10px;border-radius:8px;font-size:12.5px;
  line-height:1.45;background:var(--superficie);color:var(--tenue);
}
.ed-ayuda b{color:var(--acordes);font-family:var(--mono)}
#ed-cuerpo,#ex-texto{
  width:100%;min-height:210px;padding:11px;border-radius:8px;
  background:var(--superficie);border:1px solid var(--borde);color:var(--letra);
  font-family:var(--mono);font-size:13px;line-height:1.5;
  white-space:pre;overflow-wrap:normal;outline:none;resize:vertical;
}
#ed-cuerpo:focus{border-color:var(--acordes)}
.ed-rotulo-previa{
  margin:16px 0 7px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tenue);
}
.ed-previa{
  padding:11px;border-radius:8px;border:1px dashed var(--borde);
  font-size:14px;min-height:60px;
}
.btn-borrar{
  display:block;width:100%;margin-top:22px;padding:12px;border-radius:8px;
  border:1px solid var(--peligro);color:var(--peligro);font-size:14px;
}

/* Fila de acciones arriba de la lista de canciones */
.acciones{display:flex;gap:8px;padding:0 14px 12px}
.acciones button{
  flex:1;padding:10px;border-radius:8px;border:1px solid var(--borde);
  font-size:14px;font-weight:600;color:var(--letra);
}
.acciones .exportar{color:var(--lista);border-color:var(--lista)}

/* Cartel de aviso momentáneo */
.aviso-flotante{
  position:fixed;left:50%;bottom:78px;transform:translate(-50%,14px);
  z-index:60;padding:9px 15px;border-radius:20px;
  background:var(--superficie-alta);border:1px solid var(--borde);
  font-size:13px;opacity:0;pointer-events:none;transition:.22s;
}
.aviso-flotante.visible{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>


<!-- ===================================================================
     ESTRUCTURA
     =================================================================== -->
<div class="tope">
  <div class="tope-fila">
    <div class="marca">Cancionero <span class="ver">__VERSION__</span></div>
    <button class="expandir" id="expandir" title="Pantalla completa">⛶</button>
    <div class="sync"><span class="punto" id="punto"></span><span id="sync-txt">…</span></div>
  </div>
  <div class="pestanas">
    <button class="pestana activa" id="tab-canciones">Canciones</button>
    <button class="pestana" id="tab-guardadas">Historial</button>
    <button class="pestana" id="tab-reunion">Evento<span class="cuenta" id="cuenta" style="display:none">0</span></button>
    <button class="pestana" id="tab-online">Online</button>
  </div>
  <div class="buscador" id="caja-buscador">
    <input id="buscar" type="search" placeholder="Buscar por nombre o tono" autocomplete="off">
  </div>
  <div class="orden-fila" id="caja-orden">
    <button class="orden-btn" data-orden="nombre">Nombre</button>
    <button class="orden-btn" data-orden="tono">Tono</button>
    <button class="orden-btn" data-orden="bpm">BPM</button>
  </div>
  <div class="buscador" id="caja-buscador-guardadas" style="display:none">
    <input id="bg-buscar" type="search" placeholder="Buscar por nombre" autocomplete="off">
  </div>
</div>

<div class="contenido" id="contenido"></div>
<div class="pie-reunion" id="pie" style="display:none"></div>

<!-- Lector -->
<div class="lector" id="lector">
  <div class="lector-tope">
    <div class="lector-barra">
      <button class="cerrar" id="cerrar" title="Volver">←</button>
      <div class="lector-tit">
        <div class="lector-nombre" id="l-nombre"></div>
        <div class="lector-meta" id="l-meta"></div>
      </div>
      <div class="ctrl">
        <button class="online-badge" id="online-badge" title="Transmitir esta canción" style="display:none">O</button>
        <button id="menos-t" title="Bajar medio tono">♭</button>
        <button id="mas-t" title="Subir medio tono">♯</button>
        <button id="menos-a" title="Letra más chica">A−</button>
        <button id="mas-a" title="Letra más grande">A+</button>
        <button id="dir-toggle" title="Ser director: lo que veas se transmite a la pestaña Online">D</button>
        <button id="vaciar-transmision" title="Vaciar la transmisión (por si quedó una canción vieja pegada)">⟲</button>
        <button id="editar" title="Editar la canción">✎</button>
      </div>
    </div>
    <div class="riel" id="riel"></div>
  </div>
  <div class="cuerpo" id="cuerpo"></div>
  <div class="lector-pie" id="l-pie"></div>
</div>

<!-- Editor de canción -->
<div class="lector" id="editor">
  <div class="lector-tope">
    <div class="lector-barra">
      <button class="cerrar" id="ed-cancelar" title="Volver sin guardar">←</button>
      <div class="lector-tit"><div class="lector-nombre" id="ed-titulo">Editar</div></div>
      <button class="btn-guardar" id="ed-guardar">Guardar</button>
    </div>
  </div>
  <div class="ed-cuerpo">
    <div class="ed-campos">
      <label>Nombre<input id="ed-nombre" type="text" autocomplete="off"></label>
      <div class="ed-fila2">
        <label>Tono<input id="ed-tono" type="text" placeholder="G, Bm…" autocomplete="off"></label>
        <label>BPM<input id="ed-bpm" type="number" placeholder="—"></label>
      </div>
      <div class="ed-transportar">
        <span>Transportar el original</span>
        <button id="ed-bemol" title="Bajar medio tono">♭</button>
        <button id="ed-sostenido" title="Subir medio tono">♯</button>
      </div>
    </div>

    <div class="ed-ayuda">
      Una línea por renglón. Los acordes se reconocen solos.
      Para forzar el tipo, empezá la línea con:
      <b>:</b> rótulo · <b>&gt;</b> acordes · <b>.</b> letra
    </div>

    <textarea id="ed-cuerpo" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>

    <div class="ed-rotulo-previa">Vista previa</div>
    <div class="ed-previa" id="ed-previa"></div>

    <button class="btn-borrar" id="ed-borrar">Borrar esta canción del cancionero</button>
  </div>
</div>

<!-- Exportar los cambios -->
<div class="lector" id="exportar">
  <div class="lector-tope">
    <div class="lector-barra">
      <button class="cerrar" id="ex-cerrar" title="Volver">←</button>
      <div class="lector-tit"><div class="lector-nombre">Exportar cambios</div>
      <div class="lector-meta" id="ex-meta"></div></div>
    </div>
  </div>
  <div class="ed-cuerpo">
    <div class="ed-ayuda" id="ex-ayuda"></div>
