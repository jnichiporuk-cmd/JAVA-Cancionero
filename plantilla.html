}

/* Sólo el director puede borrar eventos del historial, y no se puede
   borrar el activo (rompería el puntero cancionero/activa). El borrado
   es de verdad (no "marcar borrada" como las canciones): a diferencia
   de canciones/{id}, acá se escucha toda la colección con un solo
   listener, así que un borrado real también se nota en el momento en
   los demás dispositivos. */
async function borrarReunion(r){
  if (!est.esDirector) return flotar("Solo directores pueden borrar eventos");
  if (!confirm(`¿Borrar el evento "${r.nombre || "Sin nombre"}" del historial? No se puede deshacer.`)) return;
  if (!HAY_NUBE){ flotar("Sin conexión: no se puede borrar"); return; }
  try{
    await fs.deleteDoc(fs.doc(db, "reuniones", r.id));
    flotar("Evento borrado");
  }catch(e){
    console.error("No se pudo borrar el evento:", e);
    flotar("No se pudo borrar el evento");
  }
}

/* --- Pestaña Online -----------------------------------------------------
   Sin pasos intermedios: si hay algo transmitido, entrar acá ya muestra
   la vista en vivo de sólo lectura (mostrarVistaOnline()); si no hay
   nada, se queda en un aviso simple. Salir es la flecha de siempre. */
/* Fondo de la pestaña Online: refleja el estado real (vacío, o "hay
   transmisión" con un botón para volver a verla), pero nunca abre nada
   sola. Se usa después de que alguien cierra la vista en vivo a
   propósito, para no forzarle a volver a entrar pero tampoco mentirle
   diciendo "vacío" si en realidad sigue habiendo transmisión. */
function fondoOnline(){
  $("pie").style.display = "none";
  const d = est.lista.enVivo;
  const s = d ? PORID[d.cancionId] : null;

  if (!s){
    $("contenido").innerHTML = `<div class="vacio">
      <strong>Online vacío</strong>
      Todavía nadie que sea director eligió una canción del Evento.
      Cuando lo haga, aparece acá sola.</div>`;
    return;
  }

  $("contenido").innerHTML = `<div class="vacio">
    <strong>Hay una transmisión en vivo</strong>
    "${escapar(s.nombre)}"</div>`;
  const acc = document.createElement("div");
  acc.className = "acciones";
  acc.innerHTML = `<button id="btn-ver-vivo">Ver transmisión en vivo</button>`;
  $("contenido").appendChild(acc);
  $("btn-ver-vivo").onclick = () => mostrarVistaOnline(d);
}

/* Punto de entrada de la pestaña: dibuja el fondo y, si hay algo
   transmitido, la abre directo (para eso está la pestaña Online, no
   hace falta ningún botón de "activar"). */
function renderOnline(){
  fondoOnline();
  const d = est.lista.enVivo;
  /* Si hay transmisión y existe la canción o nota, mostrarla */
  const existeCancion = d && PORID[d.cancionId];
  const existeNota = d && esNota(d.cancionId) && est.lista.notas[d.cancionId];
  if (existeCancion || existeNota) mostrarVistaOnline(d);
}

/* Nombres de día abreviados, domingo primero (así coincide con
   Date.getDay()). A mano, sin toLocaleDateString, por la misma razón
   que fechaHoyTexto(): no depender de la configuración regional. */
const DIAS_SEMANA = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

/* Fecha y hora en "ddd dd/mm/aa · hh:mm", a partir de un timestamp. Se
   usa tanto para "fechaReunion" (el día en que se va a tocar, editable)
   como para mostrarle al usuario el valor actual antes de cambiarlo. El
   día de la semana adelante es para verlo de un vistazo sin tener que
   calcular qué día cae una fecha. */
function fechaHoraTexto(ms){
  const d = new Date(ms);
  const pad = n => String(n).padStart(2, "0");
  const anio = String(d.getFullYear()).slice(-2);
  return `${DIAS_SEMANA[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${anio} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* Línea "tono · bpm" de cada fila. Si el título del cancionero no trae
   tono, se dice así en vez de mostrar un dato inventado. En la pestaña
   Reunión se pasa el transporte guardado (semis) para esta reunión: así
   el resumen muestra el tono real en el que se va a tocar, no el
   original, sin tener que abrir cada canción para saberlo. */
function metaDe(s, semis){
  let tono;
  if (s.tono){
    const tonoMostrado = semis ? moverTono(s.tono, semis) : s.tono;
    tono = `<span class="tono">${escapar(tonoMostrado)}</span>`
      + (semis ? ` <span style="color:var(--tenue)">(original ${escapar(s.tono)})</span>` : "");
  } else {
    tono = `<span style="color:var(--tenue)">sin tono</span>`;
  }
  return tono + (s.bpm ? " · " + s.bpm + " bpm" : "");
}

/* Escapar texto antes de meterlo en innerHTML */
function escapar(t){
  return String(t).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
}


/* ===================================================================
   11. ACCIONES SOBRE LA LISTA
   Cada una toca el estado, redibuja y recién después guarda: la
   pantalla responde al toque sin esperar la red.
   =================================================================== */
async function alternarEnLista(id){
  if (!est.esDirector) return flotar("Solo directores pueden modificar eventos");
  /* Si todavía no hay reunión activa (primer + de la reunión de hoy), se
     crea sola con la fecha de hoy como nombre. */
  const esNueva = !est.lista.id;
  if (esNueva){
    const ahora = Date.now();
    est.lista = { id: generarIdReunion(), ids:[], porQuien:"", cuando:ahora, nombre: fechaHoyTexto(), semis:{}, notas:{}, fechaReunion:ahora, directoresLatido:{} };
  }

  const i = est.lista.ids.indexOf(id);
  if (i >= 0){ est.lista.ids.splice(i,1); flotar("Sacada del evento"); }
  else {
    /* Insertar en la posición especificada o al final */
    if (est.posicionInsertarEn !== null && est.posicionInsertarEn !== undefined){
      est.lista.ids.splice(est.posicionInsertarEn, 0, id);
      flotar("Sumada como siguiente");
      est.posicionInsertarEn = null;
    } else {
      est.lista.ids.push(id);
      flotar("Sumada al evento");
    }
  }
  render();
  if (esNueva){
    await crearReunion(est.lista.id, est.lista.nombre, est.lista.ids, est.lista.semis, est.lista.notas, est.lista.fechaReunion);
    /* Fija el evento nuevo como el actual y empieza latido */
    guardarEventoLocal(est.lista.id);
    if (est.esDirector) iniciarLatido(est.lista.id);
  } else {
    guardarLista();
  }
}
function quitar(id){
  const s = PORID[id];
  if (!confirm(`¿Sacar "${s ? s.nombre : id}" de este evento?`)) return;
  est.lista.ids = est.lista.ids.filter(x => x !== id);
  render(); guardarLista();
}

/* ===================================================================
   Arrastrar para reordenar el Evento. El gesto sólo se conecta a la
   fila cuando está prendido "Reordenar" (chip del pie); fuera de ese
   modo tocar la fila abre la canción, como siempre.

   Mientras se arrastra, la fila tocada NUNCA se destruye ni se vuelve a
   crear: se mueve de verdad en el DOM (insertBefore contra la fila
   vecina, un paso a la vez) y sólo se actualiza el numerito de orden de
   cada una. Se probó primero rehaciendo toda la lista con renderReunion()
   en cada cruce de fila, pero varios navegadores cortan el gesto de
   arrastre (touchcancel) en cuanto el elemento que se está tocando
   desaparece del DOM, así que sólo llegaba a moverse un lugar por toque.
   Recién al soltar se llama a renderReunion(), para que cada fila quede
   con los índices bien religados a su posición final. */
let arrastre = null;  // { i, filaEl, startY, moviendo, alto }

function iniciarArrastre(e, i, filaEl){
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  arrastre = { i, filaEl, startY: y, moviendo: false, alto: filaEl.offsetHeight || 60 };
}

function actualizarNumerosOrden(){
  $("contenido").querySelectorAll(".fila .orden").forEach((el, idx) => { el.textContent = idx + 1; });
}

function moverArrastre(e){
  if (!arrastre) return;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  let dy = y - arrastre.startY;

  if (!arrastre.moviendo){
    if (Math.abs(dy) < 8) return;  // todavía puede ser sólo un toque
    arrastre.moviendo = true;
    arrastre.filaEl.classList.add("arrastrando");
  }
  if (e.cancelable) e.preventDefault();  // ya es arrastre: no scrollea la página

  const cont = $("contenido");
  const alto = arrastre.alto;

  /* Un paso por vez, cruzando la mitad de la fila vecina: es el mismo
     umbral "a medio camino" que usan la mayoría de las listas
     reordenables. Un while (no un if) para no perder pasos si el dedo
     se mueve rápido y salta más de una fila entre dos eventos. */
  while (dy > alto / 2 && arrastre.i < est.lista.ids.length - 1){
    const vecino = cont.querySelectorAll(".fila")[arrastre.i + 1];
    if (!vecino) break;
    cont.insertBefore(vecino, arrastre.filaEl);
    const a = est.lista.ids;
    [a[arrastre.i], a[arrastre.i + 1]] = [a[arrastre.i + 1], a[arrastre.i]];
    arrastre.i++;
    arrastre.startY += alto;
    dy -= alto;
  }
  while (dy < -alto / 2 && arrastre.i > 0){
    const vecino = cont.querySelectorAll(".fila")[arrastre.i - 1];
    if (!vecino) break;
    cont.insertBefore(arrastre.filaEl, vecino);
    const a = est.lista.ids;
    [a[arrastre.i], a[arrastre.i - 1]] = [a[arrastre.i - 1], a[arrastre.i]];
    arrastre.i--;
    arrastre.startY -= alto;
    dy += alto;
  }

  arrastre.filaEl.style.transform = `translateY(${dy}px)`;
  actualizarNumerosOrden();
}

function soltarArrastre(){
  if (!arrastre) return;
  const huboArrastre = arrastre.moviendo;
  arrastre = null;
  if (huboArrastre){
    guardarLista();
    est.reordenando = false;  // Desactivar modo reordenamiento después de soltar
    renderReunion();  // religar los índices de cada fila a su posición final
  }
}
function vaciar(){
  if (!est.esDirector) return flotar("Solo directores pueden vaciar eventos");
  if (!confirm("¿Vaciar la lista de este evento? Cualquiera que lo tenga elegido lo va a ver vacío.")) return;
  est.lista.ids = [];
  est.lista.notas = {};
  render(); guardarLista();
}


/* ===================================================================
   12. LECTOR
   =================================================================== */
/* Transporte guardado para esta canción en la reunión activa, si lo hay.
   No depende de si el lector está abierto: también lo usa el resumen de
   la pestaña Reunión, para mostrar el tono real sin abrir cada canción. */
function semisGuardado(id){
  return (est.lista.semis && est.lista.semis[id]) || 0;
}

/* Se llama después de tocar ♭/♯ en el lector. Fuera de modo reunión no
   hace nada: ahí el transporte sigue siendo de sesión, como siempre.
   Sin ser director tampoco hace nada: los botones ya quedan apagados
   para ese caso (pintarLector), esto es la segunda barrera por si algo
   los llama igual.

   A diferencia de guardarLista() (que manda ids y semis completos),
   esto escribe sólo el campo semis.<id> de esta canción, con notación
   de punto. Puede haber más de un director a la vez (sección "MODO
   DIRECTOR" más abajo), y cada uno tiene en memoria su propia copia de
   est.lista.semis: si dos transportan canciones distintas casi al mismo
   tiempo y cada uno mandara el mapa entero, el segundo en escribir pisa
   el cambio del primero sin que nadie haya tocado la misma canción.
   Pasó en la práctica más de una vez (ver CLAUDE.md, sección 8c).
   Escribiendo sólo esta clave, dos transportes a canciones distintas —o
   a la misma, en momentos distintos— ya no se pueden pisar entre sí. Si
   el transporte vuelve a 0 (mismo tono original), se borra el campo en
   vez de guardar un 0: así el mapa sólo tiene lo que de verdad cambió. */
async function guardarSemisSiCorresponde(){
  if (!est.enReunion || !est.abierta || !est.lista.id) return;
  if (!est.esDirector) return;
  est.lista.semis = est.lista.semis || {};
  if (est.semis) est.lista.semis[est.abierta] = est.semis;
  else delete est.lista.semis[est.abierta];
  if (!HAY_NUBE) return;
  marcarSync("escribiendo", "guardando");
  try{
    await fs.updateDoc(fs.doc(db, "reuniones", est.lista.id), {
      [`semis.${est.abierta}`]: est.semis || fs.deleteField(),
      actualizada: Date.now(),
    });
    marcarSync("ok", "al día");
  }catch(e){
    console.error("No se pudo guardar el transporte:", e);
    marcarSync("error", "no se guardó");
    flotar("No se pudo guardar el transporte");
  }
}

function abrir(id, enReunion){
  est.abierta = id;
  est.enReunion = enReunion;
  est.soloLectura = false;  // abrir algo por cuenta propia siempre sale del modo sólo lectura
  est.semis = enReunion ? semisGuardado(id) : 0;
  $("lector").classList.add("abierto");
  pedirPantallaCompletaSiCelular();
  $("cuerpo").scrollTop = 0;
  reiniciarColapsoTope();
  scrollAnterior = 0;  /* Reset para mostrar pie al abrir */
  $("l-pie").classList.remove("oculto");  /* Mostrar pie al abrir canción */
  renderLector();
  /* No se transmite sola: el director mira canciones libremente y
     transmite a propósito con el botón O. */
}
function cerrar(){
  $("lector").classList.remove("abierto");
  est.abierta = null;
  est.soloLectura = false;
}

/* Smart scroll: solo desplaza si la canción actual está fuera de vista */
function hacerScrollRiel(){
  const riel = $("riel");
  if (!riel || !est.enReunion) return;

  const btnActual = riel.querySelector("button.aqui");
  if (!btnActual) return;

  const btnOffset = btnActual.offsetLeft;
  const btnWidth = btnActual.offsetWidth;
  const rielWidth = riel.offsetWidth;
  const rielScrollLeft = riel.scrollLeft;

  /* Verificar si el botón ya es visible */
  const btnStart = btnOffset;
  const btnEnd = btnOffset + btnWidth;
  const viewStart = rielScrollLeft;
  const viewEnd = rielScrollLeft + rielWidth;

  /* Si el botón ya está completamente visible, no hacer scroll */
  if (btnStart >= viewStart && btnEnd <= viewEnd) {
    return;
  }

  /* Si no está visible, hacer scroll para centrarlo */
  const scrollTarget = btnOffset - (rielWidth / 2) + (btnWidth / 2);
  riel.scrollLeft = Math.max(0, scrollTarget);
}


/* Lo que efectivamente toca el botón ← del lector: además de cerrar, si
   se estaba mirando la vista en vivo manda al listado del Evento (sea o
   no director), en vez de dejar a alguien parado en la pestaña Online,
   que ahí no tiene nada más para hacer. */
function cerrarLector(){
  const veniaDeSoloLectura = est.soloLectura;
  cerrar();
  if (!veniaDeSoloLectura) return;
  est.pestana = "reunion";
  render();
}

function renderLector(){
  /* Manejar notas (texto libre) */
  if (esNota(est.abierta)){
    const nota = est.lista.notas[est.abierta] || {nombre: "", contenido: ""};
    const cuerpo = $("cuerpo");
    cuerpo.style.fontSize = est.tamano + "px";
    cuerpo.innerHTML = `
      <div class="titulo-cancion">
        <div class="lector-nombre" style="font-style:normal;color:var(--letra)">${escapar(nota.nombre)}</div>
      </div>
      <div class="nota-contenido-lector" style="padding:16px 14px;white-space:pre-wrap">${escapar(nota.contenido)}</div>
    `;
    $("mas-t").disabled = true;
    $("menos-t").disabled = true;
    $("mas-t").style.opacity = ".25";
    $("menos-t").style.opacity = ".25";
    $("editar").style.display = est.esDirector && est.enReunion ? "" : "none";
    $("editar").onclick = () => mostrarDialogoNota(nota, (notaEditada) => {
      est.lista.notas[est.abierta] = notaEditada;
      guardarLista();
      renderLector();
    });
    /* Actualizar badge de Online/Offline igual que para canciones */
    const enVivo = !!(est.lista.enVivo && est.lista.enVivo.cancionId === est.abierta);
    const mostrarOnline = (est.esDirector && est.enReunion) || est.soloLectura;
    $("en-vivo-badge").style.display = mostrarOnline ? "" : "none";
    $("en-vivo-badge").classList.toggle("en-vivo", enVivo);
    $("en-vivo-badge").textContent = enVivo ? "Online" : "Offline";
    $("en-vivo-badge").disabled = !est.esDirector;
    $("en-vivo-badge").title = est.esDirector
      ? (enVivo ? "Se está transmitiendo esta anotación" : "Transmitir esta anotación")
      : "Vista Online: la ven todos los que estén siguiendo";
    if (est.enReunion){
      const riel = $("riel"), pie = $("l-pie");
      riel.classList.add("visible");
      riel.innerHTML = "";
      est.lista.ids.forEach((id, i) => {
        const b = document.createElement("button");
        b.textContent = i + 1;
        b.className = i === est.posicion ? "aqui" : (i < est.posicion ? "pasada" : "");
        b.onclick = () => {
          const estabaTransmitiendo = !!est.lista.enVivo;
          est.posicion = i; est.abierta = id; est.semis = semisGuardado(id);
          /* Si estaba transmitiendo, actualizar enVivo antes de pintar */
          if (estabaTransmitiendo){
            est.lista.enVivo = {
              cancionId: est.abierta,
              semis: est.semis,
              posicion: est.posicion,
              cuando: Date.now(),
            };
          }
          $("cuerpo").scrollTop = 0; reiniciarColapsoTope(); renderLector();
          if (estabaTransmitiendo && est.esDirector) activarTransmision();
        };
        riel.appendChild(b);
      });
      const idSig = est.lista.ids[est.posicion + 1];
      const sig = esNota(idSig) ? null : PORID[idSig];

      const btnAgregar = `<button class="btn">+ Agregar</button>`;

      let infoSiguiente = "";
      if (idSig && esNota(idSig)){
        const notaSig = est.lista.notas[idSig] || {nombre: "", contenido: ""};
        infoSiguiente = `<button class="siguiente-info">
          <div class="si-etiqueta">Siguiente</div>
          <div class="fila-nombre" style="color:var(--tenue);font-style:italic">${escapar(notaSig.nombre)}</div>
        </button>`;
      } else if (sig){
        infoSiguiente = `<button class="siguiente-info">
          <div class="si-etiqueta">Siguiente</div>
          <div class="fila-nombre">${escapar(sig.nombre)}</div>
          <div class="fila-meta">${metaDe(sig, semisGuardado(idSig))}</div>
        </button>`;
      } else {
        infoSiguiente = `<div class="si-fin-derecha">Última anotación del evento</div>`;
      }

      pie.innerHTML = `<div style="display:flex;gap:12px;align-items:center;width:100%;min-width:0">${btnAgregar}<div style="flex:2;text-align:right;min-width:0;overflow:hidden">${infoSiguiente}</div></div>`;

      const btnAdd = pie.querySelector(".btn");
      if (btnAdd) btnAdd.onclick = () => mostrarDialogoTipo(est.posicion);

      const btnSig = pie.querySelector(".siguiente-info");
      if (btnSig) btnSig.onclick = () => paso(+1);
    }
    return;
  }

  const s = PORID[est.abierta];
  if (!s) return cerrar();

  /* Sin tono en el título no hay transporte posible: no se puede saber
     desde dónde se mueve. Se apagan los botones en vez de adivinar. */
  const puedeTransportar = !!s.tono;
  const tonoActual = puedeTransportar ? moverTono(s.tono, est.semis) : null;

  /* El título ya no es una barra fija: ahora es la primera línea del
     cuerpo (ver más abajo, después de pintarBloques), así que scrollea
     junto con la letra en vez de competir con la cabecera por lugar. La
     cabecera fija queda sólo con la flecha, el riel y los botones. */
  const metaTexto = (puedeTransportar
      ? `<span style="color:var(--tenue)">${escapar(tonoActual)}</span>`
        + (est.semis ? ` <span style="color:var(--tenue)">(original ${escapar(s.tono)}, ${est.semis > 0 ? "+" : ""}${est.semis})</span>` : "")
      : `<span style="color:var(--tenue)">sin tono en el cancionero</span>`)
    + (s.bpm ? ` · ${s.bpm} bpm` : "");

  /* Dentro de un evento (lo abrió del Evento o está viendo la
     transmisión de Online), sólo el director puede transportar, editar
     o navegar: el resto ve la canción tal como está guardada, o sigue
     el evento desde Online. Si esta misma persona también es director,
     no se le apaga nada, mire lo que mire. Fuera de un evento (una
     canción abierta suelta desde Canciones) no hay bloqueo: ahí el
     transporte es de sesión, por dispositivo, y no se comparte. */
  const bloqueado = est.soloLectura && !est.esDirector;
  ["mas-t","menos-t"].forEach(k => {
    $(k).disabled = !puedeTransportar || bloqueado;
    $(k).style.opacity = (puedeTransportar && !bloqueado) ? "" : ".25";
    $(k).classList.toggle("on", puedeTransportar && est.semis !== 0);
  });
  $("editar").style.display = bloqueado ? "none" : "";

  /* Botón Online/Offline: visible para el director en cualquier canción del evento
     (para poder transmitirla a propósito) y para cualquiera que esté en
     la vista en vivo (ahí, sólo como indicador). Verde cuando la
     canción que se ve es justo la que está en vivo. */
  const enVivo = !!(est.lista.enVivo && est.lista.enVivo.cancionId === est.abierta);
  const mostrarOnline = (est.esDirector && est.enReunion) || est.soloLectura;
  $("en-vivo-badge").style.display = mostrarOnline ? "" : "none";
  $("en-vivo-badge").classList.toggle("en-vivo", enVivo);
  $("en-vivo-badge").textContent = enVivo ? "Online" : "Offline";
  $("en-vivo-badge").disabled = !est.esDirector;
  $("en-vivo-badge").title = est.esDirector
    ? (enVivo ? "Se está transmitiendo esta canción" : "Transmitir esta canción")
    : "Vista Online: la ven todos los que estén siguiendo";

  /* Escritura con bemoles si el tono destino lo pide */
  const conBemoles = puedeTransportar && TONOS_BEMOL.has(tonoActual);

  /* Cuerpo: título primero (pintarBloques vacía el cuerpo, por eso el
     título se inserta después, no antes), y un div por bloque
     respetando el orden del cancionero. */
  const cuerpo = $("cuerpo");
  cuerpo.style.fontSize = est.tamano + "px";
  renderBloques(cuerpo, s.bloques, est.semis, conBemoles);
  cuerpo.insertAdjacentHTML("afterbegin",
    `<div class="titulo-cancion">
       <div class="lector-nombre">${escapar(s.nombre)}</div>
       <div class="lector-meta">${metaTexto}</div>
     </div>`);

  /* Riel: sólo en modo reunión. Bloqueado, se ve la posición pero no se
     puede tocar. */
  const riel = $("riel"), pie = $("l-pie");
  riel.classList.toggle("visible", est.enReunion);
  if (est.enReunion){
    riel.innerHTML = "";
    est.lista.ids.forEach((id, i) => {
      const b = document.createElement("button");
      b.textContent = i + 1;
      b.className = i === est.posicion ? "aqui" : (i < est.posicion ? "pasada" : "");
      if (!bloqueado) b.onclick = () => {
        const estabaTransmitiendo = !!est.lista.enVivo;
        est.posicion = i; est.abierta = id; est.semis = semisGuardado(id);
        /* Si estaba transmitiendo, actualizar enVivo antes de pintar */
        if (estabaTransmitiendo){
          est.lista.enVivo = {
            cancionId: est.abierta,
            semis: est.semis,
            posicion: est.posicion,
            cuando: Date.now(),
          };
        }
        $("cuerpo").scrollTop = 0; reiniciarColapsoTope(); renderLector();
        if (estabaTransmitiendo && est.esDirector) activarTransmision();
      };
      riel.appendChild(b);
    });
    /* Hacer scroll automático del riel para que la canción actual sea visible */
    hacerScrollRiel();
  }

  /* Pie con botón "+ Agregar canción" (izquierda) e info de siguiente (derecha).
     Si no hay siguiente, muestra "Última canción del evento". */
  pie.classList.toggle("visible", est.enReunion);
  if (est.enReunion){
    const idSig = est.lista.ids[est.posicion + 1];
    const sig = esNota(idSig) ? null : PORID[idSig];

    // Botón "+ Agregar canción"
    const btnAgregar = `<button class="btn"${bloqueado ? " disabled" : ""}>+ Agregar</button>`;

    // Info de siguiente o última canción
    let infoSiguiente = "";
    if (idSig && esNota(idSig)){
      const nota = est.lista.notas[idSig] || {nombre: "", contenido: ""};
      infoSiguiente = `<button class="siguiente-info"${bloqueado ? " disabled" : ""}>
        <div class="si-etiqueta">Siguiente</div>
        <div class="fila-nombre" style="color:var(--tenue);font-style:italic">${escapar(nota.nombre)}</div>
      </button>`;
    } else if (sig){
      infoSiguiente = `<button class="siguiente-info"${bloqueado ? " disabled" : ""}>
        <div class="si-etiqueta">Siguiente</div>
        <div class="fila-nombre">${escapar(sig.nombre)}</div>
        <div class="fila-meta">${metaDe(sig, semisGuardado(idSig))}</div>
      </button>`;
    } else {
      infoSiguiente = `<div class="si-fin-derecha">Última ${esNota(est.abierta) ? "anotación" : "canción"} del evento</div>`;
    }

    pie.innerHTML = `<div style="display:flex;gap:12px;align-items:center;width:100%;min-width:0">${btnAgregar}<div style="flex:2;text-align:right;min-width:0;overflow:hidden">${infoSiguiente}</div></div>`;

    // Event listeners
    const btnAdd = pie.querySelector(".btn");
    if (btnAdd && !bloqueado) btnAdd.onclick = () => abrirAgregarDesdeCancion(est.posicion);

    const btnSig = pie.querySelector(".siguiente-info");
    if (btnSig && !bloqueado) btnSig.onclick = () => paso(+1);

    actualizarPieCercaFin();
  }
}

/* Muestra la cabecera de vuelta: se llama junto con cada scrollTop=0
   que abre/cambia de canción (no dentro de renderLector() en general,
   que también se llama por cosas como transportar o cambiar tamaño de
   letra — ahí no hay que reaparecer la cabecera de golpe). */
function reiniciarColapsoTope(){
  $("lector-tope").classList.remove("oculta");
}

/* Al scrollear, esconde la cabecera entera (flecha, riel y botones)
   con su animación; al volver arriba del todo, la muestra de nuevo.
   Sin freeze ni preventDefault a propósito: se probaron esas variantes
   y terminaban peleando contra el scroll nativo del teléfono. Acá el
   scroll queda 100% nativo — puede que el título (no la letra, ver
   comentario en el CSS) se corra un poco de más mientras la cabecera
   se achica, pero nunca se traba. */
function actualizarColapsoTope(){
  $("lector-tope").classList.toggle("oculta", $("cuerpo").scrollTop > 0);
}

/* Oculta/muestra el pie según la dirección del scroll */
let scrollAnterior = 0;
function actualizarVisibilidadPie(){
  const cuerpo = $("cuerpo");
  const pie = $("l-pie");
  const scrollActual = cuerpo.scrollTop;

  /* Verificar si estamos cerca del final */
  const noScrollea = cuerpo.scrollHeight <= cuerpo.clientHeight + 4;
  const cercaFin = noScrollea || (scrollActual + cuerpo.clientHeight >= cuerpo.scrollHeight - 24);

  /* Si está cerca del final, siempre mostrar pie */
  if (cercaFin){
    pie.classList.remove("oculto");
  } else if (scrollActual > scrollAnterior && scrollActual > 50){
    /* Si scrollea hacia abajo y no está cerca del final, ocultar pie */
    pie.classList.add("oculto");
  } else {
    /* Si sube o está al principio, mostrar pie */
    pie.classList.remove("oculto");
  }

  scrollAnterior = scrollActual;
}

/* Decide si mostrar la tarjeta "Siguiente": sólo cuando se llegó al
   final del scroll, o cuando la canción es tan corta que ni entra
   scroll (si no, nunca se podría llegar a ver). */
function actualizarPieCercaFin(){
  if (!est.enReunion) return;
  const cuerpo = $("cuerpo");
  const noScrollea = cuerpo.scrollHeight <= cuerpo.clientHeight + 4;
  const cercaFin = noScrollea || (cuerpo.scrollTop + cuerpo.clientHeight >= cuerpo.scrollHeight - 24);
  $("l-pie").classList.toggle("cerca-fin", cercaFin);
}

function paso(delta){
  /* Bloquea navegación sólo en vista online (soloLectura).
     En la vista canción del evento (enReunion), cualquiera (director o
     músico) puede navegar. */
  if (est.soloLectura && !est.esDirector) return;
  const j = est.posicion + delta;
  if (j < 0 || j >= est.lista.ids.length) return;
  const estabaTransmitiendo = !!est.lista.enVivo;
  est.posicion = j;
  est.abierta = est.lista.ids[j];
  est.semis = semisGuardado(est.abierta);
  /* Si estaba transmitiendo, actualizar enVivo localmente antes de pintar
     para que el botón muestre "Online" correctamente al instante. */
  if (estabaTransmitiendo){
    est.lista.enVivo = {
      cancionId: est.abierta,
      semis: est.semis,
      posicion: est.posicion,
      cuando: Date.now(),
    };
  }
  $("cuerpo").scrollTop = 0;
  reiniciarColapsoTope();
  renderLector();
  if (estabaTransmitiendo && est.esDirector) activarTransmision();
}


/* ===================================================================
   12b. EDITOR DE CANCIONES
   El cuerpo se edita como texto plano en una tipografía monoespaciada:
   es la única forma de que quien edita vea y controle los espacios que
   alinean el acorde sobre la sílaba. La vista previa de abajo usa la
   misma función de dibujado que el lector, así no hay sorpresas.
   =================================================================== */
const RE_TONO_VALIDO = /^[A-G](#|b)?(m|maj|min)?[0-9]*$/;

function abrirEditor(id){
  est.editando = id;
  const nueva = (id === "nueva");
  const s = nueva ? null : PORID[id];
  if (!nueva && !s) return;

  $("ed-titulo").textContent = nueva ? "Nueva canción" : "Editar canción";
  $("ed-nombre").value = nueva ? "" : s.nombre;
  $("ed-tono").value   = nueva ? "" : (s.tono || "");
  $("ed-bpm").value    = nueva ? "" : (s.bpm || "");
  $("ed-cuerpo").value = nueva ? "" : bloquesATexto(s.bloques);
  $("ed-borrar").style.display = nueva ? "none" : "block";

  $("editor").classList.add("abierto");
  refrescarPrevia();
  actualizarBotonesTransporteEditor();
}

function cerrarEditor(){
  $("editor").classList.remove("abierto");
  est.editando = null;
}

/* Vista previa en vivo: se redibuja en cada tecla. Son pocas líneas, no
   hace falta esperar a que el usuario deje de escribir. */
function refrescarPrevia(){
  const bloques = textoABloques($("ed-cuerpo").value);
  const tono = $("ed-tono").value.trim();
  renderBloques($("ed-previa"), bloques, 0, /^(F|Bb|Eb|Ab|Db|Gb)m?$/.test(tono));
}

/* Sin un tono válido no se sabe desde dónde transportar (mismo motivo
   que en el lector), así que los botones quedan apagados. */
function actualizarBotonesTransporteEditor(){
  const tono = $("ed-tono").value.trim();
  const ok = !!tono && RE_TONO_VALIDO.test(tono);
  ["ed-bemol","ed-sostenido"].forEach(k => {
    $(k).disabled = !ok;
    $(k).style.opacity = ok ? "" : ".25";
  });
}

/* --- Transportar el original --------------------------------------------
   A diferencia del transporte del lector (de sesión, o guardado por
   reunión), esto reescribe de verdad los acordes y el tono: es la forma
   de corregir el tono de una canción cuando se cargó mal, o de dejarla
   permanentemente en otro tono. Reusa moverLinea/moverTono, los mismos
   que usa el lector, así el resultado es idéntico al que ya se ve ahí. */
function transportarEditor(delta){
  const tonoActual = $("ed-tono").value.trim();
  if (!tonoActual || !RE_TONO_VALIDO.test(tonoActual)){
    flotar("Poné un tono válido antes de transportar");
    return;
  }
  const nuevoTono = moverTono(tonoActual, delta);
  const conBemoles = TONOS_BEMOL.has(nuevoTono);
  const bloques = textoABloques($("ed-cuerpo").value);
  bloques.forEach(b => { if (b.t === "a") b.v = moverLinea(b.v, delta, conBemoles); });

  $("ed-tono").value = nuevoTono;
  $("ed-cuerpo").value = bloquesATexto(bloques);
  refrescarPrevia();
  flotar(`Transportado a ${nuevoTono}`);
}

async function guardarEditor(){
  if (!est.esDirector) return flotar("Solo directores pueden editar canciones");
  const nombre = $("ed-nombre").value.trim();
  const tono = $("ed-tono").value.trim();
  const bpmTxt = $("ed-bpm").value.trim();
  const bloques = textoABloques($("ed-cuerpo").value);

  /* Validaciones: se avisa y no se guarda, en vez de guardar algo a medias */
  if (!nombre) return flotar("Falta el nombre de la canción");
  if (tono && !RE_TONO_VALIDO.test(tono)) return flotar(`"${tono}" no parece un tono`);
  if (!bloques.length) return flotar("La canción no tiene contenido");

  const nueva = (est.editando === "nueva");
  const id = nueva ? nuevoId(nombre, tono) : est.editando;
  const cancion = {
    id, nombre,
    tono: tono || null,
    bpm: bpmTxt ? parseInt(bpmTxt, 10) : null,
    bloques,
  };

  est.cambios.editados = est.cambios.editados || {};
  est.cambios.nuevas = est.cambios.nuevas || [];

  const iNueva = est.cambios.nuevas.findIndex(c => c.id === id);
  if (nueva || iNueva >= 0){
    /* Canción agregada desde la app: vive en la lista de nuevas */
    if (iNueva >= 0) est.cambios.nuevas[iNueva] = cancion;
    else est.cambios.nuevas.push(cancion);
  } else {
    /* Canción que viene del .docx: se guarda la versión editada encima */
    est.cambios.editados[id] = cancion;
  }

  recalcular();
  cerrarEditor();
  render();
  if (est.abierta === id) renderLector();
  flotar(nueva ? "Canción agregada" : "Cambios guardados");
  /* Se escribe sólo esta canción, en su propio documento */
  await guardarCancion(cancion, nueva || iNueva >= 0);
}

async function borrarCancion(idOpcional){
  if (!est.esDirector) return flotar("Solo directores pueden borrar canciones");
  const id = idOpcional || est.editando;
  const s = PORID[id];
  if (!s) return;
  if (!confirm(`¿Borrar "${s.nombre}" del cancionero? Se borra para todo el grupo.`)) return;

  est.cambios.borradas = Array.from(new Set((est.cambios.borradas || []).concat([id])));
  est.cambios.nuevas = (est.cambios.nuevas || []).filter(c => c.id !== id);
  if (est.cambios.editados) delete est.cambios.editados[id];
  est.lista.ids = est.lista.ids.filter(x => x !== id);

  recalcular();
  if (!idOpcional) cerrarEditor();  // Solo cerrar editor si se llamó desde el editor
  cerrar();
  render();
  flotar("Canción borrada");
  await marcarBorrada(id);
  await guardarLista();   // por si estaba en la lista de la reunión
}

/* ===================================================================
   12c. EXPORTAR
   Saca solamente la capa de cambios, no el cancionero entero: es lo que
   hace falta para volcarlo al .docx, y es lo bastante corto para pegarlo
   en un mensaje.
   =================================================================== */
function abrirExportar(){
  const c = est.cambios;
  const nEd = Object.keys(c.editados || {}).length;
  const nNu = (c.nuevas || []).length;
  const nBo = (c.borradas || []).length;

  const partes = [];
  if (nEd) partes.push(`${nEd} editada${nEd > 1 ? "s" : ""}`);
  if (nNu) partes.push(`${nNu} nueva${nNu > 1 ? "s" : ""}`);
  if (nBo) partes.push(`${nBo} borrada${nBo > 1 ? "s" : ""}`);
  $("ex-meta").textContent = partes.join(" · ");

  /* Generar resumen expandible */
  let resumenHTML = "";
  if (nEd) resumenHTML += `• ${nEd} canción${nEd > 1 ? "es" : ""} editada${nEd > 1 ? "s" : ""}<br>`;
  if (nNu) resumenHTML += `• ${nNu} canción${nNu > 1 ? "es" : ""} nueva${nNu > 1 ? "s" : ""}<br>`;
  if (nBo) resumenHTML += `• ${nBo} canción${nBo > 1 ? "es" : ""} borrada${nBo > 1 ? "s" : ""}<br>`;
  $("ex-resumen-contenido").innerHTML = resumenHTML;

  $("ex-texto").value = JSON.stringify({
    origen: "cancionero __VERSION__",
    exportado: new Date().toISOString(),
    cambios: est.cambios,
  }, null, 1);

  /* Interactividad del resumen expandible */
  let resumenExpandido = true;
  $("ex-resumen").onclick = () => {
    resumenExpandido = !resumenExpandido;
    $("ex-resumen-contenido").style.display = resumenExpandido ? "" : "none";
    $("ex-resumen-icon").textContent = resumenExpandido ? "▼" : "▶";
  };

  $("exportar").classList.add("abierto");
}

async function copiarExportado(){
  const t = $("ex-texto");
  try{
    await navigator.clipboard.writeText(t.value);
    flotar("Copiado");
  }catch(e){
    /* Si el portapapeles está bloqueado, al menos queda seleccionado */
    t.focus(); t.select();
    flotar("Seleccionado: copialo a mano");
  }
}

/* Genera el link de una canción y lo comparte: usa el selector nativo
   (navigator.share) si el navegador lo tiene — en celular abre WhatsApp,
   Mensajes, etc. directo — y si no, cae a copiar al portapapeles, mismo
   patrón que copiarExportado(). location.origin+pathname en vez de
   href a secas para no arrastrar querystrings viejos si ya se abrió
   otro link. */
async function compartirLink(cancion){
  const url = window.location.origin + window.location.pathname + "?cancion=" + encodeURIComponent(cancion.id);
  if (typeof navigator.share === "function"){
    try{ await navigator.share({ title: cancion.nombre, url }); return; }
    catch(e){ /* usuario canceló el selector: no hacer nada más */ return; }
  }
  try{
    await navigator.clipboard.writeText(url);
    flotar("Link copiado");
  }catch(e){
    flotar("No se pudo copiar el link");
  }
}

/* Comparte el link de un evento (cualquiera, no sólo el activo).
   Mismo patrón que compartirLink(). */
async function compartirLinkEvento(reunion){
  const url = window.location.origin + window.location.pathname + "?evento=" + encodeURIComponent(reunion.id);
  if (typeof navigator.share === "function"){
    try{ await navigator.share({ title: reunion.nombre || "Evento", url }); return; }
    catch(e){ return; }
  }
  try{
    await navigator.clipboard.writeText(url);
    flotar("Link copiado");
  }catch(e){
    flotar("No se pudo copiar el link");
  }
}

/* Asegura que la canción esté cargada en el lector y dispara el diálogo
   de impresión nativo. En el celular, "Guardar como PDF" o compartir
   directo desde ahí. No genera el PDF con una librería: reutilizamos el
   layout ya renderizado por renderBloques() en vez de reimplementarlo
   en una librería, así el acorde no se puede desalinear de la sílaba. */
function compartirPDF(cancion){
  if (est.abierta !== cancion.id) abrir(cancion.id, est.enReunion);
  setTimeout(() => window.print(), 50);
}

/* "Compartir" abre un segundo menú anclado al mismo botón ⋮ con los dos
   modos de compartir. Reutiliza mostrarMenu() en vez de inventar un
   submenú anidado. */
function mostrarMenuCompartir(e, idCancion){
  const s = PORID[idCancion];
  if (!s) return;
  mostrarMenu(e.target, [
    { label: "Compartir como link", action: () => compartirLink(s) },
    { label: "Compartir como PDF", action: () => compartirPDF(s) },
  ]);
}

/* --- Pantalla completa ---------------------------------------------------
   Gana el alto que ocupan las barras del navegador o del visor. Puede no
   estar permitida según desde dónde se abra la app, así que se avisa. */
function pedirPantallaCompletaSiCelular(){
  if (!esCelular()) return;
  if (document.fullscreenElement) return;
  try{ document.documentElement.requestFullscreen(); }catch(e){}
}

async function alternarPantallaCompleta(){
  try{
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){
    flotar("Acá no se permite pantalla completa");
  }
}
$("expandir").onclick = alternarPantallaCompleta;
document.addEventListener("fullscreenchange", () => {
  const activo = !!document.fullscreenElement;
  $("expandir").classList.toggle("activo", activo);
  $("expandir").textContent = activo ? "⛶" : "⛶";
});

/* Cambiar rol desde el indicador en la barra */

$("rol-btn-lector").onclick = mostrarPantallaRol;

/* Teclado: cómodo si alguien lo abre en la compu del ensayo */
document.addEventListener("keydown", e => {
  if (!$("lector").classList.contains("abierto")) return;
  if (e.key === "Escape") cerrarLector();
  if (est.enReunion && e.key === "ArrowRight") paso(+1);
  if (est.enReunion && e.key === "ArrowLeft")  paso(-1);
});

/* Mostrar la tarjeta "Siguiente" recién al llegar al final del scroll */
$("cuerpo").addEventListener("scroll", actualizarPieCercaFin, {passive:true});
$("cuerpo").addEventListener("scroll", actualizarColapsoTope, {passive:true});
/* Ocultar pie al scrollear hacia abajo, mostrar al subir */
$("cuerpo").addEventListener("scroll", actualizarVisibilidadPie, {passive:true});

/* Deslizar para pasar de canción en modo reunión */
let xIni = null, yIni = null;
$("cuerpo").addEventListener("touchstart", e => {
  xIni = e.touches[0].clientX; yIni = e.touches[0].clientY;
}, {passive:true});
$("cuerpo").addEventListener("touchend", e => {
  if (xIni === null || !est.enReunion) return;
  const dx = e.changedTouches[0].clientX - xIni;
  const dy = e.changedTouches[0].clientY - yIni;
  /* Sólo si el gesto es claramente horizontal, para no pelear con el scroll */
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) paso(dx < 0 ? +1 : -1);
  xIni = yIni = null;
}, {passive:true});

/* Arrastrar filas del Evento (ver iniciarArrastre/moverArrastre): estos
   se escuchan una sola vez, en el documento, porque el dedo se puede ir
   de la manija mientras arrastra. touchmove no puede ser pasivo: hay
   que poder frenar el scroll de la página una vez que el arrastre ya
   arrancó. */
document.addEventListener("touchmove", moverArrastre, {passive:false});
document.addEventListener("touchend", soltarArrastre);
document.addEventListener("mousemove", moverArrastre);
document.addEventListener("mouseup", soltarArrastre);


/* ===================================================================
   14. ARRANQUE
   Se dibuja primero con el catálogo local, que es instantáneo y no depende
   de la red. Después se conecta y se queda escuchando: cuando llegan la
   lista y las ediciones, la pantalla se actualiza sola.
   =================================================================== */
async function arrancar(){
  /* Genera el ID del dispositivo si aún no existe */
  obtenerDispositivoId();

  /* Lee ajustes de UI (tamaño de letra, orden del catálogo) */
  leerAjustes();

  /* Lee el rol (director o músico). Si no existe, intenta mostrar la
     pantalla de bienvenida bloqueante. De todos modos, continúa — la
     pantalla se mostrará, pero el arranque sigue en paralelo (sobre todo
     para las pruebas en Node). */
  const sinRol = !leerRol();
  if (sinRol){
    // Asigna handlers para que se pueda elegir, pero continúa
    try{ mostrarPantallaRol(); }catch(e){}
    // Si no se elige nada (ej. en Node), asume músico
    est.esDirector = false;
  }

  continuarArranque();
}

function mostrarPantallaRol(){
  $("bienvenida").classList.add("abierto");
  $("rol-director").onclick = () => fijarRol(true);
  $("rol-musico").onclick = () => fijarRol(false);
}

function fijarRol(esDirector){
  est.esDirector = esDirector;
  guardarRol(esDirector);
  $("bienvenida").classList.remove("abierto");
  /* En celulares, iniciar en pantalla completa automáticamente */
  if (esCelular()){
    try{ document.documentElement.requestFullscreen(); }catch(e){}
  }
  /* Si ya estamos en sesión (HAY_NUBE es true), solo recalcular y redibujar.
     Si es el primer arranque, hacer la inicialización completa. */
  if (HAY_NUBE){
    recalcular();  // recargar cambios locales
    if (est.abierta) renderLector();  // si hay canción abierta, refrescar
    else if (est.pestana) render();  // si no, redibujar la pantalla actual
  } else {
    continuarArranque();  // primer arranque
  }
}

function esCelular(){
  try{
    return window.matchMedia("(max-width: 600px)").matches
      || /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(navigator.userAgent.toLowerCase());
  }catch(e){
    return false;  // en Node o ambientes sin matchMedia
  }
}

/* Si la URL trae ?cancion=<id> (por ejemplo, alguien tocó un link
   compartido desde WhatsApp), abre esa canción directo, sin pasos
   intermedios. Envuelto en try/catch porque `location` no existe en el
   DOM simulado de probar_app.js. Si el id no está en el catálogo (link
   viejo, canción borrada), no revienta: se queda en la pantalla normal
   y avisa. */
function abrirDesdeLink(){
  try{
    const params = new URLSearchParams(window.location.search);
    const id = params.get("cancion");
    if (!id) return;
    if (PORID[id]) abrir(id, false);
    else flotar("La canción del link ya no está disponible");
  }catch(e){ /* sin location (Node) o URL malformada: ignorar */ }
}

/* Si la URL trae ?evento=<id>, activa ese evento. Se ejecuta después
   de conectar a Firestore, así el listener puede buscar el documento
   en la base directamente. */
function abrirEventoDesdeLink(){
  try{
    const params = new URLSearchParams(window.location.search);
    const id = params.get("evento");
    if (!id) return;
    fijarEventoLocal(id);
  }catch(e){ /* sin location (Node) o URL malformada: ignorar */ }
}

async function continuarArranque(){
  marcarSync("", "conectando");
  recalcular();          // catálogo base, sin cambios todavía

  /* Lee el evento local elegido (si lo hay) y lo setea en est.lista
     sin listener aún — eso arranca después de conectar (en escuchar()) */
  const eventoId = leerEventoLocal();
  if (eventoId) est.lista.id = eventoId;  // placeholder, se reemplaza al escuchar

  render();              // se ve el cancionero al instante, sin esperar la red

  abrirDesdeLink();      // si la URL trae ?cancion=id, abrir esa canción

  if (await conectar()) {
    escuchar();   // a partir de acá los cambios llegan solos

    abrirEventoDesdeLink();  // si la URL trae ?evento=id, activar ese evento

    /* Revisar vigencia de latidos cada ~15s. Firestore sólo notifica
       cambios cuando alguien escribe; si un director desaparece, su
       latido no se actualiza más, así que revisamos qué tan viejo es. */
    setInterval(() => {
      if ((est.pestana === "online" || est.soloLectura) && est.lista.directoresLatido){
        if (!hayDirectorActivo(est.lista)){
          /* Transmisión expiró, refresca la UI */
          render();
          if (est.soloLectura) cerrarVistaOnline();
        }
      }
    }, 15000);
  }
}

arrancar();

/* Antes acá había un sondeo cada 4 segundos. Ya no hace falta: onSnapshot
   avisa en el momento en que alguien cambia algo. */
</script>
